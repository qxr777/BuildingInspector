version: '2'
services:
  mysql:
    container_name: bi_mysql
    extends:
      file: mysql.yml
      service: mysql
    networks:
      - bi-net
  minio:
    container_name: biminio
    extends:
      file: minio.yml
      service: minio
    networks:
      - bi-net
  chroma:
    container_name: bi_chroma
#    image: crpi-gxv0234hwyx1jbhm.cn-beijing.personal.cr.aliyuncs.com/qxr777/chroma:1.0.8
    extends:
      file: chroma.yml
      service: chroma
    networks:
      - bi-net
  bi_building_inspector:
    image: crpi-gxv0234hwyx1jbhm.cn-beijing.personal.cr.aliyuncs.com/qxr777/building-inspector:1.0
    container_name: bi_building_inspector
    ports:
      - "8090:80"
    environment:
      # application.yml 是默认配置。部署机或 .env 中存在同名变量时才覆盖它。
      # AccessKey 只由环境变量注入，不能写入 application.yml。
      OSS_BRIDGE_UPLOAD_ENABLED:
      OSS_BRIDGE_UPLOAD_ENDPOINT:
      OSS_BRIDGE_UPLOAD_INTERNAL_ENDPOINT:
      OSS_BRIDGE_UPLOAD_USE_INTERNAL_ENDPOINT:
      OSS_BRIDGE_UPLOAD_BUCKET_NAME:
      OSS_BRIDGE_UPLOAD_OBJECT_PREFIX:
      OSS_ACCESS_KEY_ID:
      OSS_ACCESS_KEY_SECRET:
    restart: always
    networks:
      - bi-net
    depends_on:
      - mysql
      - minio
  bi_building_inspector_ai:
    image: crpi-gxv0234hwyx1jbhm.cn-beijing.personal.cr.aliyuncs.com/qxr777/building-inspector-ai:1.0
    container_name: bi_building_inspector_ai
    ports:
      - "8081:8081"
    restart: always
    networks:
      - bi-net
    depends_on:
      - mysql
      - minio
      - bi_building_inspector
      - chroma
networks:
  bi-net:
