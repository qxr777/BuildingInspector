<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" >
<head>
    <th:block th:include="include :: header('新增检测报告')" />
    <th:block th:include="include :: select2-css" />
</head>
<body class="white-bg">
<div class="wrapper wrapper-content animated fadeInRight ibox-content">
    <form class="form-horizontal m" id="form-report-add">
        <div class="form-group">
            <label class="col-sm-3 control-label is-required">报告名称：</label>
            <div class="col-sm-8">
                <input name="name" class="form-control" type="text" required>
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label is-required">项目：</label>
            <div class="col-sm-8">
                <select id="projectId" name="projectId" class="form-control select2-hidden-accessible" required>
                    <option value="">请选择项目</option>
                </select>
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label is-required">报告模板：</label>
            <div class="col-sm-8">
                <select id="reportTemplateId" name="reportTemplateId" class="form-control" required>
                    <option value="">请选择报告模板</option>
                    <option th:each="template : ${templates}" th:text="${template.name}" th:value="${template.id}"></option>
                </select>
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label is-required">任务：</label>
            <div class="col-sm-8">
                <select id="taskIds" class="form-control select2-hidden-accessible" required disabled>
                </select>
                <input type="hidden" name="taskIds" id="taskIdsInput">
                <div id="taskWarnings" class="alert alert-warning" style="display:none;margin:8px 0 0;padding:8px 12px"></div>
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label is-required">审核人：</label>
            <div class="col-sm-8">
                <select id="reviewerId" name="reviewerId" class="form-control select2-hidden-accessible" required disabled>
                    <option value="">请先选择项目</option>
                </select>
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label is-required">批准人：</label>
            <div class="col-sm-8">
                <select id="approverId" name="approverId" class="form-control select2-hidden-accessible" required disabled>
                    <option value="">请先选择项目</option>
                </select>
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">备注：</label>
            <div class="col-sm-8">
                <textarea name="remark" class="form-control"></textarea>
            </div>
        </div>
    </form>
</div>
<th:block th:include="include :: footer" />
<th:block th:include="include :: select2-js" />
<script th:inline="javascript">
    var prefix = ctx + "biz/report";

    $(function() {
        // 初始化Select2控件
        $(".select2-hidden-accessible").select2({
            width: "100%"
        });

        // 加载项目列表
        loadProjects();

        // 项目选择事件
        $("#projectId").on("change", function() {
            var projectId = $(this).val();
            if (projectId) {
                // 加载项目下的任务列表
                loadTasks(projectId);
                // 加载项目下的用户列表
                loadUsers(projectId);
            } else {
                // 清空任务列表和用户列表
                $("#taskIds").html('').prop("disabled", true);
                $("#taskIdsInput").val(""); // 清空隐藏字段
                $("#reviewerId").html('<option value="">请先选择项目</option>').prop("disabled", true);
                $("#approverId").html('<option value="">请先选择项目</option>').prop("disabled", true);
            }
        });

        // 报告模板选择事件
        $("#reportTemplateId").on("change", function() {
            var selectedOption = $(this).find("option:selected");
            var templateName = selectedOption.text();
            
            // 如果模板名称不包含"单桥"，则允许多选
            if (templateName && templateName.indexOf("单桥") === -1) {
                $("#taskIds").attr("multiple", true);
            } else {
                $("#taskIds").removeAttr("multiple");
            }
            
            // 重新初始化select2以应用multiple属性变化
            $("#taskIds").select2("destroy").select2({
                width: "100%",
                closeOnSelect: !$("#taskIds").prop("multiple")
            });
            // 清空已选择的值
            $("#taskIds").val("").trigger("change");
            $("#taskIdsInput").val("");
        });

        // 任务选择事件
        $("#taskIds").on("change", function() {
            var selectedTasks = $(this).val();
            if (selectedTasks) {
                // 如果是多选，selectedTasks是数组，用逗号拼接；单选则是字符串
                if (Array.isArray(selectedTasks)) {
                    $("#taskIdsInput").val(selectedTasks.join(","));
                } else {
                    $("#taskIdsInput").val(selectedTasks);
                }
            } else {
                $("#taskIdsInput").val("");
            }
            checkTaskWarnings();
        });
    });

    var taskWarningSeq = 0;

    function isSingleBridgeTemplate() {
        var name = $("#reportTemplateId option:selected").text() || "";
        return name.indexOf("单桥") !== -1 && name.indexOf("多桥") === -1;
    }

    // 单桥缺卡片只提示，不拦截；缺评定结果或多桥缺卡片仍拦截
    function blockingTaskWarnings(warnings) {
        if (!isSingleBridgeTemplate()) {
            return warnings;
        }
        var blocking = [];
        $.each(warnings, function(_, warning) {
            if (warning.indexOf("评定结果") !== -1) {
                blocking.push(warning.replace("桥梁卡片、", "").replace("、桥梁卡片", ""));
            } else if (warning.indexOf("缺少桥梁卡片") === -1) {
                blocking.push(warning);
            }
        });
        return blocking;
    }

    function checkTaskWarnings(callback) {
        var seq = ++taskWarningSeq;
        var ids = $("#taskIdsInput").val();
        if (!ids) {
            renderTaskWarnings([]);
            if (callback) callback([]);
            return;
        }
        $.ajax({
            url: prefix + "/checkTasks",
            type: "post",
            data: {taskIds: ids},
            dataType: "json",
            success: function(result) {
                if (seq !== taskWarningSeq) return;
                var warnings = result && result.code == 0 && result.data ? result.data : [];
                renderTaskWarnings(warnings);
                if (callback) callback(warnings);
            },
            error: function() {
                if (seq !== taskWarningSeq) return;
                renderTaskWarnings([]);
                if (callback) callback([]);
            }
        });
    }

    function renderTaskWarnings(warnings) {
        var $box = $("#taskWarnings");
        var blocking = blockingTaskWarnings(warnings);
        var cardNotice = isSingleBridgeTemplate() && warnings.some(function(warning) {
            return warning.indexOf("缺少桥梁卡片") !== -1;
        });
        if (!blocking.length && !cardNotice) {
            $box.hide().empty();
            return;
        }
        $box.empty();
        if (blocking.length) {
            $box.append($("<div>").text("以下桥梁暂时无法生成报告，请先补齐："));
            $.each(blocking, function(i, warning) {
                $box.append($("<div>").text("· " + warning));
            });
        }
        if (cardNotice) {
            $box.append($("<div>").text("没有桥梁卡片信息"));
        }
        $box.show();
    }

    function escapeTaskWarning(text) {
        return $("<div>").text(text).html();
    }

    // 加载项目列表
    function loadProjects() {
        $.ajax({
            url: ctx + "biz/project/projectList",
            type: "post",
            dataType: "json",
            success: function(result) {
                if (result && result.length > 0) {
                    var html = '<option value="">请选择项目</option>';
                    $.each(result, function(i, project) {
                        html += '<option value="' + project.id + '">' + project.name + '</option>';
                    });
                    $("#projectId").html(html);
                }
            }
        });
    }

    // 加载任务列表
    function loadTasks(projectId) {
        $.ajax({
            url: ctx + "biz/task/listAll/" + projectId,
            type: "post",
            dataType: "json",
            success: function(result) {
                if (result && result.length > 0) {
                    var html = '';
                    $.each(result, function(i, task) {
                        var buildingName = task.building ? task.building.line + " - " + task.building.name : '未知桥梁';
                        // 如果有父桥名称，则显示父桥名称+桥梁名称
                        if (task.building && task.building.parentName) {
                            buildingName = task.building.parentName + " - " + buildingName;
                        }
                        html += '<option value="' + task.id + '">' + buildingName + '</option>';
                    });
                    $("#taskIds").html(html).prop("disabled", false).val(null).trigger("change");
                } else {
                    $("#taskIds").html('<option value="">该项目下暂无任务</option>').prop("disabled", true);
                }
            }
        });
    }

    // 加载用户列表
    function loadUsers(projectId) {
        $.ajax({
            url: ctx + "biz/project/usersList/" + projectId,
            type: "get",
            dataType: "json",
            success: function(result) {
                if (result && result.length > 0) {
                    // 审核人
                    var reviewerHtml = '<option value="">请选择审核人</option>';
                    $.each(result, function(i, user) {
                        reviewerHtml += '<option value="' + user.userId + '">' + user.loginName + '</option>';
                    });
                    $("#reviewerId").html(reviewerHtml).prop("disabled", false);

                    // 批准人
                    var approverHtml = '<option value="">请选择批准人</option>';
                    $.each(result, function(i, user) {
                        approverHtml += '<option value="' + user.userId + '">' + user.loginName + '</option>';
                    });
                    $("#approverId").html(approverHtml).prop("disabled", false);
                } else {
                    $("#reviewerId").html('<option value="">该项目下暂无用户</option>').prop("disabled", true);
                    $("#approverId").html('<option value="">该项目下暂无用户</option>').prop("disabled", true);
                }
            }
        });
    }

    $("#form-report-add").validate({
        focusCleanup: true
    });

    function submitHandler() {
        if (!$.validate.form()) {
            return;
        }
        checkTaskWarnings(function(warnings) {
            var save = function() {
                $.operate.save(prefix + "/add", $('#form-report-add').serialize());
            };
            var blocking = blockingTaskWarnings(warnings);
            if (!blocking.length) {
                save();
                return;
            }
            $.modal.confirm("以下桥梁暂时无法生成报告：<br>" + blocking.map(escapeTaskWarning).join("<br>")
                + "<br>补齐后才能生成。仍要保存报告吗？", save);
        });
    }
</script>
</body>
</html>
