    // 解析病害位置 props，得到参考面下拉选项
    function parseProps(props) {
        var parsedProps = {};
        if (!props) return parsedProps;

        var pairs = String(props).split('&&');
        for (var i = 0; i < pairs.length; i++) {
            var pair = pairs[i].split(':=');
            if (pair.length < 2) continue;

            var key = String(pair[0] || '').trim();
            var values = String(pair[1] || '').split('、');
            parsedProps[key] = values.map(function (value) {
                return String(value || '').trim();
            }).filter(function (value) {
                return value.length > 0;
            }).map(function (value) {
                return {id: value, name: value};
            });
        }
        return parsedProps;
    }

    // 根据当前病害位置刷新参考面选项，并保留仍然有效的已填值。
    function refreshReferenceDropdowns() {
        if (!Array.isArray(positionObjects)) return;

        var selectedPositionId = $("#position").val();
        var selectedPosition = positionObjects.find(function (item) {
            return item.id == selectedPositionId;
        });
        var parsedProps = selectedPosition ? parseProps(selectedPosition.props) : {};
        var quantity = parseInt($("#quantityInput").val(), 10) || 1;

        fillReferenceDropdowns(parsedProps, quantity);
    }

    // 特殊布局：按页面上的参考面节点回填，避免 select id 后缀与 quantity/threshold 不一致导致漏回显
    function fillSpecialReferenceDropdowns(parsedProps) {
        parsedProps = parsedProps || {};
        $('.special-reference-item').each(function () {
            var item = $(this);
            var detailIndex = Number(item.attr('data-detail-index'));
            if (isNaN(detailIndex)) {
                detailIndex = 0;
            }
            var refIndex = Number(item.attr('data-reference-index'));
            if (!refIndex) return;

            var select = item.find('.special-reference-select');
            if (!select.length) return;

            var propKey = 'ref' + refIndex;
            var rawLocation = getSavedReferenceLocationRaw(detailIndex, refIndex);
            var parsedLocation = parseSpecialReferenceLocation(rawLocation, refIndex);
            var locationName = parsedLocation.location;

            select.empty();
            select.append($('<option></option>').val('').text('请选择'));
            if (parsedProps[propKey] && parsedProps[propKey].length > 0) {
                parsedProps[propKey].forEach(function (opt) {
                    select.append($('<option></option>').val(opt.id).text(opt.name));
                });
            }

            // 特殊布局直接使用解析后的参考面名称回显。
            // 例如“顶部U肋_1_2”只用“顶部U肋”匹配下拉项。
            var matchedOption = select.find('option').filter(function () {
                return String($(this).val() || '').trim() === locationName;
            }).first();
            if (locationName && matchedOption.length > 0) {
                select.val(matchedOption.val());
            } else {
                select.val('');
            }
        });
    }

    // 填充参考面下拉框选项，并回显已保存值（特殊布局会去掉序号后再匹配选项）
    function fillReferenceDropdowns(parsedProps, quantity, threshold) {
        parsedProps = parsedProps || {};

        if (specialQuantitativeLayout) {
            fillSpecialReferenceDropdowns(parsedProps);
            return;
        }

        var selectedDiseaseTypeId = $("#diseaseTypeId").val();
        var selectedDiseaseType = selectedDiseaseTypeId && Array.isArray(diseaseTypes) ? diseaseTypes.find(function (item) {
            return item.id == selectedDiseaseTypeId;
        }) : null;
        var thresholdValue = (selectedDiseaseType && selectedDiseaseType.threshold) ? selectedDiseaseType.threshold : 10;

        function fillOneSelect(select, customInput, propKey, detailIndex, refIndex) {
            if (!select.length) return;

            var currentValue = select.attr('data-current-value') || select.val();
            select.removeAttr('data-current-value');
            if (currentValue === '其他' && customInput && customInput.length) {
                currentValue = customInput.val();
            }
            currentValue = String(currentValue || '').trim();

            select.empty();
            select.append($('<option></option>').val('').text('请选择'));
            if (parsedProps[propKey] && parsedProps[propKey].length > 0) {
                parsedProps[propKey].forEach(function (item) {
                    select.append($('<option></option>').val(item.id).text(item.name));
                });
            }
            select.append($('<option></option>').val('其他').text('其他'));

            applyReferenceSelectValue(select, customInput, currentValue);
        }

        if (quantity >= thresholdValue) {
            fillOneSelect($('#reference1Location'), $('#reference1LocationCustom'), 'ref1', 0, 1);
            fillOneSelect($('#reference2Location'), $('#reference2LocationCustom'), 'ref2', 0, 2);
        } else {
            for (var i = 0; i < quantity; i++) {
                fillOneSelect($('#reference1Location_' + i), $('#reference1LocationCustom_' + i), 'ref1', i, 1);
                fillOneSelect($('#reference2Location_' + i), $('#reference2LocationCustom_' + i), 'ref2', i, 2);
            }
        }
    }

    // 处理参考面位置下拉框变化的通用函数
    function handleRefChange(select, customInputId) {
        var customInput = $('#' + customInputId);
        if (!customInput.length) {
            customInput = $(select).siblings('#' + customInputId);
        }
        if ($(select).val() === '其他') {
            customInput.show();
            customInput.attr('required', 'required');
        } else {
            customInput.hide();
            customInput.removeAttr('required');
            customInput.val('');
        }
    }

    // 文件选择预览处理
    $("#diseaseFiles").change(function () {
        var previewContainer = $("#filePreview");
        var files = this.files;

        if (files && files.length > 0) {
            for (var i = 0; i < files.length; i++) {
                var file = files[i];
                var isImage = file.type.startsWith('image/');

                var col = $('<div class="col-sm-2 mb-2"></div>');
                var thumbnail = $('<div class="thumbnail" data-file-index="' + i + '"></div>');

                if (isImage) {
                    // 如果是图片，创建图片预览
                    var reader = new FileReader();
                    reader.onload = (function (file, thumbnail) {
                        return function (e) {
                            thumbnail.append(
                                '<div class="preview-image">' +
                                '<a href="javascript:void(0);" class="preview-image">' +
                                '<img src="' + e.target.result + '" class="img-thumbnail" style="height:150px;width:150px;object-fit:cover;">' +
                                '</a>' +
                                '</div>'
                            );
                        };
                    })(file, thumbnail);
                    reader.readAsDataURL(file);
                } else {
                    // 如果是其他类型的文件，显示文件图标
                    thumbnail.append(
                        '<div class="text-center" style="padding: 20px;">' +
                        '<i class="fa fa-file fa-3x mb-2"></i>' +
                        '<p class="mb-0" style="word-break: break-all;">' + file.name + '</p>' +
                        '</div>'
                    );
                }

                // 添加删除按钮和隐藏的文件信息
                thumbnail.append(
                    '<button type="button" class="btn btn-xs btn-danger" style="position:absolute;top:5px;right:5px;" onclick="removeFilePreview(this)">' +
                    '<i class="fa fa-trash"></i></button>' +
                    '<input type="hidden" class="file-data" name="fileData" value="' + encodeURIComponent(JSON.stringify({
                        name: file.name,
                        type: file.type,
                        size: file.size,
                        lastModified: file.lastModified
                    })) + '">'
                );

                col.append(thumbnail);
                previewContainer.append(col);
            }
        }

        // 保存文件到全局变量
        saveFilesToGlobal();
    });

    // 全局变量存储所有文件
    var globalFiles = [];

    // 保存文件到全局变量
    function saveFilesToGlobal() {
        var fileInput = document.getElementById('diseaseFiles');
        if (fileInput.files) {
            for (var i = 0; i < fileInput.files.length; i++) {
                globalFiles.push(fileInput.files[i]);
            }
        }
        // 清空input，以便可以重复选择同一文件
        fileInput.value = '';
    }

    // 移除文件预览
    window.removeFilePreview = function (btn) {
        var $thumbnail = $(btn).closest('.thumbnail');
        var fileData = JSON.parse(decodeURIComponent($thumbnail.find('.file-data').val()));

        // 从全局文件数组中移除对应文件
        globalFiles = globalFiles.filter(function (file) {
            return !(file.name === fileData.name &&
                file.size === fileData.size &&
                file.lastModified === fileData.lastModified);
        });

        $(btn).closest('.col-sm-2').remove();
    };

    // 移除已存在的文件
    window.removeExistingFile = function (btn) {
        var $container = $(btn).closest('.col-sm-2');
        var fileId = $(btn).data('id');
        if (fileId) {
            $.modal.confirm("确定要删除该文件吗？", function () {
                $.ajax({
                    url: prefix + "/attachment/delete/" + fileId,
                    type: 'DELETE',
                    success: function (response) {
                        if (response.code === 0) {
                            $.modal.msgSuccess("删除成功");
                            $container.remove();
                        } else {
                            $.modal.alertError(response.msg);
                        }
                    },
                    error: function () {
                        $.modal.alertError("删除失败，请稍后重试");
                    }
                });
            });
        }
    };

    function applySpecialReferenceFormData(formData) {
        $('.special-reference-item').each(function () {
            var item = $(this);
            var detailIndex = item.data('detail-index');
            var refIndex = Number(item.data('reference-index'));
            var namePrefix = 'diseaseDetails[' + detailIndex + ']';
            var locationName = namePrefix + '.reference' + refIndex + 'Location';
            var offsetName = namePrefix + '.reference' + refIndex + 'LocationStart';
            var unusedEndName = namePrefix + '.reference' + refIndex + 'LocationEnd';
            var select = item.find('.special-reference-select');
            var location = '';

            if (select.length) {
                location = String(select.val() || '').trim();
                if (location === '其他') {
                    location = String(item.find('.custom-reference').val() || '').trim();
                }
            } else {
                location = String(item.find('[name="' + locationName + '"]').val() || '').trim();
            }

            var startSequence = String(item.find('.special-reference-sequence-start').val() || '').trim();
            var endSequence = String(item.find('.special-reference-sequence-end').val() || '').trim();
            var storedLocation = location;
            if (location && refIndex === 1 && startSequence) {
                storedLocation += '_' + startSequence;
            } else if (location && refIndex === 2 && (startSequence || endSequence)) {
                storedLocation += '_' + startSequence + '_' + endSequence;
            }

            if (storedLocation) {
                formData.set(locationName, storedLocation);
            } else {
                formData.delete(locationName);
            }

            var offsetValue = String(item.find('.special-offset-value').val() || '').trim();
            if (offsetValue) {
                var absoluteOffset = Math.abs(Number(offsetValue));
                var direction = item.find('.special-direction-value').val();
                formData.set(offsetName, direction === '负方向' ? -absoluteOffset : absoluteOffset);
            } else {
                formData.delete(offsetName);
            }
            formData.delete(unusedEndName);
        });
    }

    // 修改表单提交处理
    function submitHandler() {
        var componentNameInput = $("#biObjectName");
        if (!String(componentNameInput.val() || '').trim()) {
            $.modal.alertWarning("当前病害缺少构件名称，请填写后再保存");
            componentNameInput.focus();
            return;
        }

        if ($.validate.form() && validateForm()) {
            var formData = new FormData($("#form-disease-edit")[0]);

            // 处理自定义病害类型
            var selectedDiseaseTypeId = $("#diseaseTypeId").val();
            var selectedDiseaseType = selectedDiseaseTypeId ? diseaseTypes.find(function (item) {
                return item.id == selectedDiseaseTypeId;
            }) : null;
            if (isCustomDiseaseType(selectedDiseaseType)) {
                formData.set("type", String($("#customDiseaseType").val() || '').trim());
            }

            // 处理自定义病害位置
            var positionText = $("#position option:selected").text().trim();
            if (positionText === "其他" || positionText === "其它") {
                formData.set("position", $("#customPosition").val());
            } else {
                formData.set("position", positionText);
            }

            // 确保deductPoints是整数
            var deductPoints = $("#deductPoints").val();
            formData.set("deductPoints", deductPoints ? parseInt(deductPoints) : 0);

            // 确保每个diseaseDetail都有diseaseId
            var diseaseId = $("input[name='id']").val();
            if (diseaseId) {
                // 查找所有diseaseDetail表单字段
                var detailElements = $("[name^='diseaseDetails[']");
                var detailsMap = {};

                // 按索引组织数据
                detailElements.each(function () {
                    var name = $(this).attr('name');
                    var matches = name.match(/diseaseDetails\[(\d+)\]\.(.+)/);
                    if (matches && matches.length === 3) {
                        var index = matches[1];
                        var field = matches[2];

                        if (!detailsMap[index]) {
                            detailsMap[index] = {};
                        }

                        var value = $(this).val();
                        detailsMap[index][field] = value;

                        // 为每个detail添加diseaseId
                        detailsMap[index]['diseaseId'] = diseaseId;
                    }
                });

                // 注意：参考面位置值已经在FormData收集后直接处理了，这里不需要重复处理

                // 清除原有的diseaseDetails数据
                detailElements.each(function () {
                    formData.delete($(this).attr('name'));
                });

                // 重新添加带有diseaseId的数据
                for (var index in detailsMap) {
                    var detail = detailsMap[index];
                    for (var field in detail) {
                        formData.append(`diseaseDetails[${index}].${field}`, detail[field]);
                    }
                }

            }

            // 添加所有预览区域的文件到FormData
            globalFiles.forEach(function (file, index) {
                formData.append('files', file);
            });

            // 添加已有附件的ID列表
            var existingAttachmentIds = [];
            $('input[name^="attachments["][name$=".id"]').each(function () {
                var id = $(this).val();
                if (id && !existingAttachmentIds.includes(id)) {
                    existingAttachmentIds.push(id);
                }
            });

            // 将附件ID数组转换为逗号分隔的字符串
            if (existingAttachmentIds.length > 0) {
                formData.append('existingAttachmentIds', existingAttachmentIds.join(','));
            }

            var quantity = $("#quantityInput").val();

            // quantity 是后端 int 字段；紧固件数量允许留空时用 0 提交，避免空字符串绑定失败。
            if (isCurrentFastenerCountDisease()) {
                formData.set("fastenerCountMode", "true");
                if (!String(quantity || '').trim()) {
                    formData.set("quantity", "0");
                }
            }

            // 获取当前选中的病害类型
            // 获取threshold值，默认为10
            var threshold = (selectedDiseaseType && selectedDiseaseType.threshold) ? selectedDiseaseType.threshold : 10;

            // 特殊模板将参考面、序号和带方向偏移量转换为数据库字段格式。
            if (specialQuantitativeLayout) {
                applySpecialReferenceFormData(formData);
            } else if (quantity >= threshold) {
                // 单病害情况
                var ref1Select = $("#reference1Location");
                var ref2Select = $("#reference2Location");

                var ref1Value = ref1Select.val();
                var ref2Value = ref2Select.val();

                // 如果选择了"其他"，使用自定义输入框的值
                if (ref1Value === "其他") {
                    ref1Value = $("#reference1LocationCustom").val();
                }
                if (ref2Value === "其他") {
                    ref2Value = $("#reference2LocationCustom").val();
                }

                // 直接设置到FormData中
                if (ref1Value && ref1Value !== "") {
                    formData.set("diseaseDetails[0].reference1Location", ref1Value);
                    console.log("直接设置单病害参考面1位置值:", ref1Value);
                }
                if (ref2Value && ref2Value !== "") {
                    formData.set("diseaseDetails[0].reference2Location", ref2Value);
                    console.log("直接设置单病害参考面2位置值:", ref2Value);
                }
            } else {
                // 多病害情况
                for (var i = 0; i < quantity; i++) {
                    // 先清除当前索引的旧值
                    formData.delete("diseaseDetails[" + i + "].reference1Location");
                    formData.delete("diseaseDetails[" + i + "].reference2Location");

                    var ref1Select = $("#reference1Location_" + i);
                    var ref2Select = $("#reference2Location_" + i);

                    var ref1Value = ref1Select.val();
                    var ref2Value = ref2Select.val();

                    // 如果选择了"其他"，使用自定义输入框的值
                    if (ref1Value === "其他") {
                        ref1Value = $("#reference1LocationCustom_" + i).val();
                    }
                    if (ref2Value === "其他") {
                        ref2Value = $("#reference2LocationCustom_" + i).val();
                    }

                    // 设置新值到FormData中
                    if (ref1Value && ref1Value !== "") {
                        formData.set("diseaseDetails[" + i + "].reference1Location", ref1Value);
                    }
                    if (ref2Value && ref2Value !== "") {
                        formData.set("diseaseDetails[" + i + "].reference2Location", ref2Value);
                    }
                }
            }

            $.modal.loading("正在提交数据，请稍候...");
            $.ajax({
                url: prefix + "/edit",
                type: 'POST',
                data: formData,
                contentType: false,
                processData: false,
                success: function (response) {
                    $.modal.closeLoading();
                    if (response.code === 0) {
                        $.modal.msgSuccess("保存成功");
                        localStorage.setItem("refreshDiseaseTable", Date.now()); // 设置一个刷新标志（附带时间避免缓存）
                        $.modal.closeTab();
                        parent.$.table.refresh();
                    } else {
                        $.modal.alertError(response.msg);
                    }
                },
                error: function () {
                    $.modal.closeLoading();
                    $.modal.alertError("保存失败，请稍后再试");
                }
            });
        }
    }

    // 添加下载文件的函数
    function downloadFile(url, fileName) {
        // 创建一个XMLHttpRequest对象
        var xhr = new XMLHttpRequest();
        xhr.open('GET', url, true);
        xhr.responseType = 'blob';

        xhr.onload = function () {
            if (xhr.status === 200) {
                // 创建blob链接
                var blob = new Blob([xhr.response], {type: xhr.getResponseHeader('Content-Type')});
                var link = document.createElement('a');

                // 添加fileName参数到URL
                var downloadUrl = url;
                if (url.indexOf('?') === -1) {
                    downloadUrl += '?fileName=' + encodeURIComponent(fileName);
                } else {
                    downloadUrl += '&fileName=' + encodeURIComponent(fileName);
                }

                // 设置下载链接和文件名
                link.href = window.URL.createObjectURL(blob);
                link.download = fileName;

                // 触发下载
                document.body.appendChild(link);
                link.click();

                // 清理
                document.body.removeChild(link);
                window.URL.revokeObjectURL(link.href);
            }
        };

        // 发送请求
        xhr.send();
    }

    // 添加辅助函数：将DataURI转换为Blob
    function dataURItoBlob(dataURI) {
        var byteString = atob(dataURI.split(',')[1]);
        var mimeString = dataURI.split(',')[0].split(':')[1].split(';')[0];
        var ab = new ArrayBuffer(byteString.length);
        var ia = new Uint8Array(ab);
        for (var i = 0; i < byteString.length; i++) {
            ia[i] = byteString.charCodeAt(i);
        }
        return new Blob([ab], {type: mimeString});
    }

    // 显示当前图片并控制按钮显示

        $('#nextImage').on('click', function (e) {

    function getSpecialReferenceSymbol(refIndex, locationName) {
        var normalizedName = String(locationName || '').replace(/\s+/g, '');
        var symbols = refIndex === 1
                ? {'横隔板': 'H', '纵隔板': 'Z'}
                : {'顶部U肋': 'U', '底部U肋': 'DU'};
        return symbols[normalizedName] || normalizedName;
    }

    function formatSpecialSignedOffset(referenceItem) {
        var rawOffset = String(referenceItem.find('.special-offset-value').val() || '').trim();
        if (!rawOffset) return '';

        var numericOffset = Number(rawOffset);
        var absoluteOffset = Number.isNaN(numericOffset)
                ? rawOffset.replace(/^[+-]/, '')
                : String(Math.abs(numericOffset));
        var direction = referenceItem.find('.special-direction-value').val();
        var sign = direction === '负方向' ? '-' : '+';
        return '(' + sign + absoluteOffset + ')';
    }

    function getSpecialDetailValue(detailCard, fieldName) {
        var field = detailCard.find('[name$=".' + fieldName + '"]').first();
        return field.length ? String(field.val() == null ? '' : field.val()).trim() : '';
    }

    function formatSpecialRange(start, end) {
        if (start && end) return start + '~' + end;
        return start || end || '';
    }

    function buildSpecialQuantitativeText(detailCard) {
        var quantitativeParts = [];
        var lengthParts = ['length1', 'length2', 'length3'].map(function (fieldName) {
            return getSpecialDetailValue(detailCard, fieldName);
        }).filter(Boolean);
        var lengthValue = lengthParts.join('+');
        if (!lengthValue) {
            lengthValue = formatSpecialRange(
                    getSpecialDetailValue(detailCard, 'lengthRangeStart'),
                    getSpecialDetailValue(detailCard, 'lengthRangeEnd')
            );
        }
        if (lengthValue) quantitativeParts.push('L=' + lengthValue + 'mm');

        var widthValue = getSpecialDetailValue(detailCard, 'crackWidth')
                || getSpecialDetailValue(detailCard, 'width');
        if (!widthValue) {
            widthValue = formatSpecialRange(
                    getSpecialDetailValue(detailCard, 'crackWidthRangeStart'),
                    getSpecialDetailValue(detailCard, 'crackWidthRangeEnd')
            );
        }
        if (widthValue) quantitativeParts.push('W=' + widthValue + 'mm');

        var areaLength = getSpecialDetailValue(detailCard, 'areaLength')
                || getSpecialDetailValue(detailCard, 'areaLengthRange');
        var areaWidth = getSpecialDetailValue(detailCard, 'areaWidth')
                || getSpecialDetailValue(detailCard, 'areaWidthRange');
        if (areaLength || areaWidth) {
            quantitativeParts.push('S=' + [areaLength, areaWidth].filter(Boolean).join('×') + 'cm²');
        }

        var deformationValue = getSpecialDetailValue(detailCard, 'deformation');
        if (!deformationValue) {
            deformationValue = formatSpecialRange(
                    getSpecialDetailValue(detailCard, 'deformationRangeStart'),
                    getSpecialDetailValue(detailCard, 'deformationRangeEnd')
            );
        }
        if (deformationValue) quantitativeParts.push('D=' + deformationValue + 'mm');

        return quantitativeParts.join('，');
    }

    function extractSpecialDiseaseName(diseaseTypeText) {
        var text = String(diseaseTypeText || '').trim();
        var separatorIndex = text.indexOf('#');
        return separatorIndex >= 0 ? text.substring(separatorIndex + 1).trim() : text;
    }

    function isURibDeformationDisease(diseaseName) {
        return String(diseaseName || '').replace(/\s+/g, '') === 'U肋变形(鼓曲)';
    }

    function getFastenerDescriptionName(diseaseName) {
        return String(diseaseName || '').replace(/[（(]螺栓[）)]/, '');
    }

    function getURibDeformationSeverity(detailCard) {
        var deformationValue = getSpecialDetailValue(detailCard, 'deformation');
        var values = deformationValue
                ? [deformationValue]
                : [
                    getSpecialDetailValue(detailCard, 'deformationRangeStart'),
                    getSpecialDetailValue(detailCard, 'deformationRangeEnd')
                ];
        var numericValues = values.filter(function (value) {
            return String(value || '').trim() !== '';
        }).map(function (value) {
            return Math.abs(Number(value));
        }).filter(function (value) {
            return !Number.isNaN(value);
        });
        if (!numericValues.length) return '';

        var deformationAmount = Math.max.apply(null, numericValues);
        if (deformationAmount < 1) return '轻度';
        if (deformationAmount < 4) return '中度';
        return '重度';
    }

    function generateSpecialDiseaseDescription(positionNumber, crackType, diseaseTypeText, quantity, units) {
        var diseaseName = extractSpecialDiseaseName(diseaseTypeText);
        var isURibDeformation = isURibDeformationDisease(diseaseName);
        var isFastenerCount = isCurrentFastenerCountDisease();
        var descriptions = [];

        $('#diseaseDetails .defect-card').each(function () {
            var detailCard = $(this);
            var reference1 = detailCard.find('.special-reference-item[data-reference-index="1"]');
            var reference2 = detailCard.find('.special-reference-item[data-reference-index="2"]');

            var reference1Name = reference1.find('.special-reference-select').val()
                    || reference1.find('[name$=".reference1Location"]').val();
            var reference2Name = reference2.find('.special-reference-select').val()
                    || reference2.find('[name$=".reference2Location"]').val();
            var reference1Sequence = String(reference1.find('.special-reference-sequence-start').val() || '').trim();
            var reference2StartSequence = String(reference2.find('.special-reference-sequence-start').val() || '').trim();
            var reference2EndSequence = String(reference2.find('.special-reference-sequence-end').val() || '').trim();

            var reference1Text = getSpecialReferenceSymbol(1, reference1Name)
                    + String(positionNumber || '').trim()
                    + reference1Sequence
                    + formatSpecialSignedOffset(reference1);
            var reference2Text = getSpecialReferenceSymbol(2, reference2Name) + reference2StartSequence;
            if (reference2EndSequence) {
                reference2Text += '-' + reference2EndSequence;
            } else {
                reference2Text += formatSpecialSignedOffset(reference2);
            }

            var positionText = reference1Text + reference2Text;
            var quantitativeText = buildSpecialQuantitativeText(detailCard);
            if (isFastenerCount) {
                var countAndUnit = String(quantity || '').trim();
                if (countAndUnit) countAndUnit += String(units || '').trim();
                descriptions.push([
                    positionText,
                    getFastenerDescriptionName(diseaseName) + countAndUnit
                ].filter(Boolean).join('，'));
            } else if (isURibDeformation) {
                descriptions.push([
                    positionText,
                    getURibDeformationSeverity(detailCard) + String(crackType || '') + diseaseName,
                    quantitativeText
                ].filter(Boolean).join('，'));
            } else {
                var positionAndCrack = positionText;
                if (crackType) positionAndCrack += '-' + crackType;
                descriptions.push([
                    positionAndCrack,
                    diseaseName,
                    quantitativeText
                ].filter(Boolean).join('，'));
            }
        });

        return descriptions.join('；');
    }

    // 生成病害描述（普通页面规则函数）
    function generateDiseaseDescription(data) {
        var componentName = data.componentName;
        var componentCode = data.componentCode;
        var showColumns = data.showColumns || [];
        var diseaseType = data.diseaseType;
        var diseasePosition = data.diseasePosition;
        var positionNumber = data.positionNumber;
        var crackType = data.crackType;
        var defects = data.defects || [];
        var counts = data.counts || 0;
        var units = data.units || '';
        var threshold = data.threshold;

        var count = defects.length;
        if (count === 0) return '还未填写病害数据';

        var mileageText = ''; // 页面当前无里程字段，置空

        var description = componentCode + '#' + componentName;
        if (componentName !== diseasePosition) {
            description += '，' + (positionNumber ? ('第' + positionNumber + '#') : '') + diseasePosition;
        }
        description += '，' + mileageText;
        description += (diseaseType && diseaseType.split ? (diseaseType.split('#')[1] || diseaseType) : diseaseType);
        description += (counts > 0 ? ('' + counts) : '');
        description += (units !== '' ? units : '个');

        if (showColumns[0] == 1 && crackType) {
            description += '，' + crackType + '裂缝';
        }
        var descriptionArr = [];

        if (counts < threshold) {
            var details = defects.map(function (item, index) {
                if (showColumns[8] == 1 && item.reference1Location && item.reference1LocationStart) {
                    descriptionArr.push('距' + item.reference1Location + ' ' + item.reference1LocationStart + 'm');
                }
                if (showColumns[9] == 1 && item.reference2Location && item.reference2LocationStart) {
                    descriptionArr.push('距' + item.reference2Location + ' ' + item.reference2LocationStart + 'm');
                }
                if (showColumns[1] == 1 && item.length1) {
                    var lengthUnit = specialQuantitativeLayout ? 'mm' : 'm';
                    if (specialQuantitativeLayout) {
                        var lengthParts = [item.length1, item.length2, item.length3].filter(function (value) {
                            return value !== null && value !== undefined && value !== '';
                        });
                        descriptionArr.push('长度L=' + lengthParts.join('+') + lengthUnit);
                    } else if (crackType === 'L型') {
                        descriptionArr.push('长度L1=' + item.length1 + lengthUnit);
                        if (item.length2) descriptionArr.push('L2=' + item.length2 + lengthUnit);
                    } else if (crackType === 'U型') {
                        descriptionArr.push('长度L1=' + item.length1 + lengthUnit);
                        if (item.length2) descriptionArr.push('L2=' + item.length2 + lengthUnit);
                        if (item.length3) descriptionArr.push('L3=' + item.length3 + lengthUnit);
                    } else {
                        descriptionArr.push('长度L=' + item.length1 + lengthUnit);
                    }
                }
                if (showColumns[2] == 1 && item.crackWidth) {
                    descriptionArr.push('缝宽：' + item.crackWidth + 'mm');
                }
                if (showColumns[3] == 1 && item.heightDepth) {
                    descriptionArr.push('高度/深度：' + item.heightDepth + 'm');
                }
                if (showColumns[4] == 1 && item.areaLength && item.areaWidth) {
                    if (specialQuantitativeLayout) {
                        descriptionArr.push(item.areaLength + '×' + item.areaWidth + 'cm²');
                    } else {
                        var areaLabel = count >= 2 ? '_' + (index + 1) : '';
                        descriptionArr.push('面积S' + areaLabel + '=' + item.areaLength + '×' + item.areaWidth + 'm²');
                    }
                }
                if (showColumns[5] == 1 && item.deformation) {
                    descriptionArr.push('变形/位移：' + item.deformation + (specialQuantitativeLayout ? 'mm' : 'm'));
                }
                if (showColumns[6] == 1 && item.angle) {
                    descriptionArr.push('角度：' + item.angle + '度');
                }
                if (showColumns[7] == 1 && item.numeratorRatio && item.denominatorRatio) {
                    descriptionArr.push('比例：' + item.numeratorRatio + '/' + item.denominatorRatio);
                }
                var prefix = count >= 2 ? '（' + (index + 1) + '）' : '';
                var result = prefix + descriptionArr.join('，');
                descriptionArr = [];
                return result;
            }).join('；');

            return description + '，' + details;
        } else {
            var item = defects[0];
            if (showColumns[8] == 1 && item.reference1Location && item.reference1LocationStart) {
                descriptionArr.push('距' + item.reference1Location + ' ' + item.reference1LocationStart + 'm');
            }
            if (showColumns[9] == 1 && item.reference2Location && item.reference2LocationStart) {
                descriptionArr.push('距' + item.reference2Location + ' ' + item.reference2LocationStart + 'm');
            }
            if (showColumns[1] == 1 && item.lengthRangeStart && item.lengthRangeEnd) {
                descriptionArr.push('长度L=' + item.lengthRangeStart + '~' + item.lengthRangeEnd + (specialQuantitativeLayout ? 'mm' : 'm'));
            }
            if (showColumns[2] == 1 && item.crackWidthRangeStart && item.crackWidthRangeEnd) {
                descriptionArr.push('缝宽：' + item.crackWidthRangeStart + '~' + item.crackWidthRangeEnd + 'mm');
            }
            if (showColumns[3] == 1 && item.heightDepthRangeStart && item.heightDepthRangeEnd) {
                descriptionArr.push('高度/深度：' + item.heightDepthRangeStart + '~' + item.heightDepthRangeEnd + 'm');
            }
            if (showColumns[4] == 1 && item.areaLength && item.areaWidth) {
                if (specialQuantitativeLayout) {
                    descriptionArr.push(item.areaLength + '×' + item.areaWidth + 'cm²');
                } else {
                    var areaLabel2 = item.areaIdentifier == 1 ? '均' : (item.areaIdentifier == 2 ? '总' : item.areaIdentifier);
                    descriptionArr.push('面积S_' + areaLabel2 + '=' + item.areaLength + '×' + item.areaWidth + 'm²');
                }
            }
            if (showColumns[5] == 1 && item.deformationRangeStart && item.deformationRangeEnd) {
                descriptionArr.push('变形/位移：' + item.deformationRangeStart + '~' + item.deformationRangeEnd + (specialQuantitativeLayout ? 'mm' : 'm'));
            }
            if (showColumns[6] == 1 && item.angleRangeStart && item.angleRangeEnd) {
                descriptionArr.push('角度：' + item.angleRangeStart + '~' + item.angleRangeEnd + '度');
            }
            if (showColumns[7] == 1 && item.numeratorRatio && item.denominatorRatio) {
                descriptionArr.push('比例：' + item.numeratorRatio + '/' + item.denominatorRatio);
            }

            var result2 = descriptionArr.join('，');
            descriptionArr = [];
            return description + '，' + result2;
        }
    }

    // 采集页面数据并填充描述（新规则）
    function generateAndFillDescriptionNew() {
        try {
            var quantityText = String($("#quantityInput").val() || '').trim();
            var counts = parseInt(quantityText || '0', 10);
            var units = $("select[name='units']").val() || '';
            var positionNumber = $("#positionNumber").val() || '';

            // 组件编码：兼容名称写错的输入name
            var componentCode = $("input[name='component.code']").val() || $("input[name='component.code']").val() || '';

            // 构件名称：直接从输入框
            var componentName = $("input[name='biObjectName']").val() || '';

            // 病害类型：优先自定义
            var diseaseType = $("#diseaseTypeId option:selected").text().trim();
            if ($("#customDiseaseType").is(":visible")) {
                var customType = $("#customDiseaseType").val();
                if (customType) diseaseType = customType.trim();
            }

            // 病害位置：与提交逻辑保持一致（文本）
            var diseasePosition = $("#position option:selected").text().trim();
            if (diseasePosition === "其他" || diseasePosition === "其它") {
                diseasePosition = $("#customPosition").val().trim();
            }

            // 当前病害类型与selectColumn/threshold
            var selectedDiseaseTypeId = $("#diseaseTypeId").val();
            var selectedDiseaseType = selectedDiseaseTypeId ? diseaseTypes.find(function (item) {
                return item.id == selectedDiseaseTypeId;
            }) : null;
            var threshold = (selectedDiseaseType && selectedDiseaseType.threshold) ? selectedDiseaseType.threshold : 10;
            var selectColumn = (selectedDiseaseType && selectedDiseaseType.selectColumn !== undefined)
                ? parseInt(selectedDiseaseType.selectColumn || 0)
                : 0;

            // showColumns: 0-7由selectColumn位控制，8/9为参考面1/2（默认显示）
            var showColumns = [
                (selectColumn & 1) === 1 ? 1 : 0,
                (selectColumn & 2) === 2 ? 1 : 0,
                (selectColumn & 4) === 4 ? 1 : 0,
                (selectColumn & 8) === 8 ? 1 : 0,
                (selectColumn & 16) === 16 ? 1 : 0,
                (selectColumn & 32) === 32 ? 1 : 0,
                (selectColumn & 64) === 64 ? 1 : 0,
                (selectColumn & 128) === 128 ? 1 : 0,
                1,
                1
            ];

            // 裂缝特征（若字段存在）
            var crackTypeEl = $("#crackType");
            var crackType = crackTypeEl.length ? crackTypeEl.val() : '';

            if (specialQuantitativeLayout) {
                var specialDescription = generateSpecialDiseaseDescription(
                        positionNumber,
                        crackType,
                        diseaseType,
                        quantityText,
                        units
                );
                $("#description").val(specialDescription);
                return;
            }

            // 组装缺损数据
            var defects = [];
            if (counts < threshold) {
                for (var i = 0; i < counts; i++) {
                    // 参考面位置，兼容"其他"
                    var r1 = $('#reference1Location_' + i).val();
                    var r2 = $('#reference2Location_' + i).val();
                    if (r1 === "其他") r1 = $('#reference1LocationCustom_' + i).val();
                    if (r2 === "其他") r2 = $('#reference2LocationCustom_' + i).val();

                    var defect = {
                        reference1Location: r1 || undefined,
                        reference1LocationStart: $("input[name='diseaseDetails[" + i + "].reference1LocationStart']").val() || undefined,
                        reference2Location: r2 || undefined,
                        reference2LocationStart: $("input[name='diseaseDetails[" + i + "].reference2LocationStart']").val() || undefined,
                        length1: $("input[name='diseaseDetails[" + i + "].length1']").val() || undefined,
                        length2: $("input[name='diseaseDetails[" + i + "].length2']").val() || undefined,
                        length3: $("input[name='diseaseDetails[" + i + "].length3']").val() || undefined,
                        crackWidth: $("input[name='diseaseDetails[" + i + "].crackWidth']").val() || undefined,
                        heightDepth: $("input[name='diseaseDetails[" + i + "].heightDepth']").val() || undefined,
                        areaLength: $("input[name='diseaseDetails[" + i + "].areaLength']").val() || undefined,
                        areaWidth: $("input[name='diseaseDetails[" + i + "].areaWidth']").val() || undefined,
                        areaIdentifier: $("select[name='diseaseDetails[" + i + "].areaIdentifier']").val() || undefined,
                        deformation: $("input[name='diseaseDetails[" + i + "].deformation']").val() || undefined,
                        angle: $("input[name='diseaseDetails[" + i + "].angle']").val() || undefined,
                        numeratorRatio: $("input[name='diseaseDetails[" + i + "].numeratorRatio']").val() || undefined,
                        denominatorRatio: $("input[name='diseaseDetails[" + i + "].denominatorRatio']").val() || undefined
                    };
                    defects.push(defect);
                }
            } else {
                // 单条范围数据
                var r1s = $('#reference1Location').val();
                var r2s = $('#reference2Location').val();
                if (r1s === "其他") r1s = $('#reference1LocationCustom').val();
                if (r2s === "其他") r2s = $('#reference2LocationCustom').val();

                var defectSingle = {
                    reference1Location: r1s || undefined,
                    reference1LocationStart: $("input[name='diseaseDetails[0].reference1LocationStart']").val() || undefined,
                    reference2Location: r2s || undefined,
                    reference2LocationStart: $("input[name='diseaseDetails[0].reference2LocationStart']").val() || undefined,
                    lengthRangeStart: $("input[name='diseaseDetails[0].lengthRangeStart']").val() || undefined,
                    lengthRangeEnd: $("input[name='diseaseDetails[0].lengthRangeEnd']").val() || undefined,
                    crackWidthRangeStart: $("input[name='diseaseDetails[0].crackWidthRangeStart']").val() || undefined,
                    crackWidthRangeEnd: $("input[name='diseaseDetails[0].crackWidthRangeEnd']").val() || undefined,
                    heightDepthRangeStart: $("input[name='diseaseDetails[0].heightDepthRangeStart']").val() || undefined,
                    heightDepthRangeEnd: $("input[name='diseaseDetails[0].heightDepthRangeEnd']").val() || undefined,
                    areaLength: $("input[name='diseaseDetails[0].areaLengthRange']").val() || undefined,
                    areaWidth: $("input[name='diseaseDetails[0].areaWidthRange']").val() || undefined,
                    areaIdentifier: $("select[name='diseaseDetails[0].areaIdentifier']").val() || undefined,
                    deformationRangeStart: $("input[name='diseaseDetails[0].deformationRangeStart']").val() || undefined,
                    deformationRangeEnd: $("input[name='diseaseDetails[0].deformationRangeEnd']").val() || undefined,
                    angleRangeStart: $("input[name='diseaseDetails[0].angleRangeStart']").val() || undefined,
                    angleRangeEnd: $("input[name='diseaseDetails[0].angleRangeEnd']").val() || undefined,
                    numeratorRatio: $("input[name='diseaseDetails[0].numeratorRatioRange']").val() || undefined,
                    denominatorRatio: $("input[name='diseaseDetails[0].denominatorRatioRange']").val() || undefined
                };
                defects.push(defectSingle);
            }

            var result = generateDiseaseDescription({
                componentName: componentName,
                componentCode: componentCode,
                showColumns: showColumns,
                diseaseType: diseaseType,
                diseasePosition: diseasePosition,
                positionNumber: positionNumber,
                crackType: crackType,
                defects: defects,
                counts: counts,
                units: units,
                threshold: threshold
            });

            $("#description").val(result);
        } catch (e) {
            console.error(e);
            $.modal.alertError("生成描述失败，请检查字段是否完整");
        }
    }
</script>

                <!-- 底部文件信息 -->

                    <div class="text-left" style="float: left">

        </div>
