<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:include="include :: header('修改病害信息')"/>
    <th:block th:include="include :: select2-css"/>
    <style>
        .main-content.disease-edit-page {
            max-width: 1440px;
            margin: 0 auto;
            padding: 15px 20px 25px;
        }

        #form-disease-edit {
            margin: 0;
        }

        .edit-section {
            padding: 0 5px 26px;
        }

        .edit-section + .edit-section {
            padding-top: 2px;
        }

        .section-heading {
            margin: 0 0 22px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 20px 28px;
            align-items: start;
        }

        .form-horizontal .form-field {
            display: grid;
            grid-template-columns: 100px minmax(0, 1fr);
            column-gap: 12px;
            align-items: start;
            min-width: 0;
            margin: 0;
        }

        /* Bootstrap 的 clearfix 伪元素会占用 Grid 单元，导致标签和控件被挤到两行。 */
        .form-horizontal .form-field::before,
        .form-horizontal .form-field::after {
            display: none;
            content: none;
        }

        .form-field > label:not(.error),
        .field-label {
            display: block;
            grid-column: 1;
            width: 100%;
            margin: 0;
            padding: 7px 0 0;
            text-align: right;
        }

        .form-field > label:not(.error)::after,
        .field-label::after {
            content: "：";
        }

        .form-field > :not(label) {
            grid-column: 2;
            min-width: 0;
        }

        .form-field > label.error {
            grid-column: 2;
            margin: 5px 0 0;
            padding: 0;
            text-align: left;
        }

        .form-field .form-control,
        .form-field .input-group,
        .form-field .select2-container,
        .detail-field .form-control,
        .reference-control .form-control {
            width: 100% !important;
            min-width: 0;
        }

        .paired-controls {
            display: flex;
            gap: 8px;
            align-items: flex-start;
            min-width: 0;
        }

        .form-field .paired-controls .select2-container,
        .form-field .paired-controls > .form-control {
            flex: 1 1 0;
            width: 0 !important;
            min-width: 0;
        }

        .field-span-2 {
            grid-column: span 2;
        }

        .field-full {
            grid-column: 1 / -1;
        }

        .quantity-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(220px, 1fr));
            gap: 20px 28px;
            max-width: calc(66.666667% - 9px);
            margin-bottom: 22px;
        }

        #quantityError,
        .reference-control .custom-reference {
            margin-top: 8px;
        }

        .option-group {
            display: flex;
            align-items: center;
            min-height: 34px;
        }

        .textarea-actions {
            display: flex;
            justify-content: flex-end;
            margin-top: 10px;
        }

        .cause-layout {
            display: grid;
            grid-template-columns: minmax(0, 1fr);
            gap: 10px;
            align-items: start;
        }

        .cause-layout .edit-command {
            justify-self: end;
        }

        .edit-command {
            display: inline-flex;
            height: 34px;
            min-width: 88px;
            padding: 6px 12px;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: 400;
            line-height: 20px;
            letter-spacing: 0;
            white-space: nowrap;
        }

        .edit-command > i {
            margin-right: 6px;
        }

        .upload-toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
        }

        #filePreview {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 14px;
            margin: 16px 0 0;
        }

        #filePreview:empty {
            display: none;
        }

        #filePreview > [class*="col-"] {
            float: none;
            width: auto;
            padding: 0;
        }

        #filePreview .thumbnail {
            position: relative;
            height: 100%;
            min-height: 150px;
            margin: 0;
        }

        #filePreview .img-thumbnail {
            width: 100% !important;
            height: 132px !important;
            object-fit: cover;
        }

        #diseaseDetails {
            display: grid;
            gap: 16px;
            margin: 0;
        }

        .defect-card {
            min-width: 0;
            margin: 0;
        }

        .defect-card-title {
            margin: 0 0 16px;
        }

        .reference-grid {
            display: grid;
            gap: 12px;
            margin-bottom: 18px;
        }

        .special-reference-grid {
            gap: 0;
            overflow-x: visible;
        }

        .reference-row {
            display: grid;
            grid-template-columns: 100px minmax(180px, 1.2fr) minmax(140px, 1fr) minmax(140px, 1fr);
            gap: 12px;
            align-items: start;
        }

        .reference-control {
            min-width: 0;
        }

        .special-reference-item {
            display: grid;
            grid-template-columns: 120px minmax(0, 1fr);
            gap: 12px;
            align-items: center;
            min-width: 0;
        }

        .special-reference-item + .special-reference-item {
            padding-top: 12px;
        }

        .special-reference-item > .field-label {
            padding-top: 0;
            align-self: center;
            line-height: 34px;
            white-space: nowrap;
        }

        .special-reference-body {
            display: grid;
            grid-template-columns: 20px minmax(0, 1.2fr) minmax(0, .8fr) minmax(0, .8fr) max-content minmax(0, .9fr);
            gap: 10px;
            align-items: center;
            min-width: 0;
        }

        .special-reference-prefix {
            text-align: center;
            line-height: 34px;
        }

        .special-select-stack {
            display: flex;
            min-width: 0;
            flex-direction: column;
            gap: 8px;
        }

        .special-select-stack .custom-reference {
            margin-top: 0;
        }

        .special-inline-input {
            min-width: 0;
        }

        .special-inline-input-wide {
            grid-column: span 2;
        }

        .special-inline-input .form-control,
        .special-offset-input .form-control {
            width: 100% !important;
        }

        .special-offset-input {
            min-width: 0;
        }

        .special-direction-group {
            white-space: nowrap;
        }
        .detail-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 16px 24px;
        }

        .defect-card > .detail-grid + .detail-grid {
            margin-top: 16px;
        }

        .detail-field {
            display: grid;
            grid-template-columns: 100px minmax(0, 1fr);
            gap: 12px;
            align-items: start;
            min-width: 0;
        }

        .special-quantitative-card .detail-field {
            grid-template-columns: 120px minmax(0, 1fr);
        }

        .special-quantitative-card .detail-field > .field-label {
            white-space: nowrap;
        }

        .detail-grid .measurement-control {
            grid-template-columns: minmax(0, 1fr) 22px;
            gap: 4px;
        }

        .detail-grid .measurement-control .input-group-addon {
            text-align: right;
        }

        .compound-input {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
            gap: 8px;
            align-items: center;
        }

        .compound-input.area-input {
            grid-template-columns: 68px minmax(64px, 1fr) auto minmax(64px, 1fr);
            gap: 6px;
        }

        /* 特殊布局面积：长 × 宽 cm²，两输入等宽 */
        .compound-input.area-input.special-area-input {
            grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr) max-content;
            gap: 8px;
        }

        .compound-input.area-input.special-area-input > .measurement-control {
            grid-template-columns: minmax(0, 1fr);
        }

        .compound-input.area-input.special-area-input > .input-group-addon {
            display: block;
            width: auto;
            padding: 0;
            background: transparent;
            border: 0;
            white-space: nowrap;
        }

        .compound-input.special-length-input.length-parts-1 {
            grid-template-columns: minmax(0, 1fr) max-content;
        }

        .compound-input.special-length-input.length-parts-2 {
            grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr) max-content;
        }

        .compound-input.special-length-input.length-parts-3 {
            grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr) auto minmax(0, 1fr) max-content;
        }

        .special-length-input > .measurement-control {
            grid-template-columns: minmax(0, 1fr);
        }

        .special-length-input > .input-group-addon {
            display: block;
            width: auto;
            padding: 0;
            background: transparent;
            border: 0;
            white-space: nowrap;
        }

        .detail-grid .ratio-input {
            grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr) 22px;
            gap: 4px;
        }

        .area-input .form-control {
            padding-right: 8px;
            padding-left: 8px;
        }

        .measurement-control {
            display: grid;
            grid-template-columns: minmax(0, 1fr) max-content;
            width: 100%;
            min-width: 0;
            gap: 6px;
            align-items: center;
        }

        .measurement-control > .form-control {
            position: static;
            z-index: auto;
            float: none;
            width: 100% !important;
            min-width: 0;
            border-radius: 4px !important;
        }

        .measurement-control .input-group-addon {
            display: block;
            width: auto;
            min-width: 0;
            padding: 0;
            white-space: nowrap;
            vertical-align: middle;
            background: transparent;
            border: 0;
            border-radius: 0;
        }

        .compound-separator {
            text-align: center;
        }

        .form-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            padding: 4px 5px 0;
        }

        @media (max-width: 1199px) {
            .form-grid,
            .detail-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }

            .field-span-2 {
                grid-column: span 2;
            }

            .quantity-grid {
                max-width: 100%;
            }

            .reference-row {
                grid-template-columns: 100px repeat(3, minmax(0, 1fr));
            }
        }

        @media (max-width: 767px) {
            .main-content.disease-edit-page {
                padding: 15px;
            }

            .edit-section {
                padding-right: 0;
                padding-bottom: 22px;
                padding-left: 0;
            }

            .form-grid,
            .detail-grid,
            .quantity-grid,
            .cause-layout {
                grid-template-columns: 1fr;
            }

            .field-span-2,
            .field-full {
                grid-column: auto;
            }

            .form-horizontal .form-field,
            .detail-field {
                grid-template-columns: 88px minmax(0, 1fr);
                column-gap: 10px;
            }

            .reference-row {
                grid-template-columns: 88px minmax(0, 1fr);
                gap: 10px;
            }

            .reference-row > .reference-control {
                grid-column: 2;
            }

            .special-reference-item {
                grid-template-columns: 120px minmax(0, 1fr);
                gap: 10px;
            }

            .paired-controls {
                flex-direction: column;
            }

            .form-field .paired-controls .select2-container,
            .form-field .paired-controls > .form-control {
                flex: none;
                width: 100% !important;
            }

            .form-actions {
                flex-wrap: wrap;
            }
        }
    </style>
</head>
<body>
<div class="main-content disease-edit-page">
    <form
            class="form-horizontal m"
            id="form-disease-edit"
            th:object="${disease}"
    >
        <input name="id" type="hidden" th:field="*{id}"/>
        <input name="projectId" type="hidden" th:field="*{projectId}"/>
        <input name="buildingId" type="hidden" th:field="*{buildingId}"/>
        <input name="taskId" type="hidden" th:field="*{taskId}"/>
        <input name="componentId" type="hidden" th:field="*{componentId}"/>
        <input id ="biObjectId" type="hidden" name="biObjectId" th:value="${biObject.id}"/>
        <input id="treeId" name="treeId" type="hidden" th:value="${biObject?.id}"/>

        <section class="edit-section" aria-labelledby="basicInfoTitle">
            <h4 class="form-header h4 section-heading" id="basicInfoTitle">基本信息</h4>
            <div class="form-grid">
                <div class="form-group form-field">
                    <label class="control-label is-required" for="treeName">部件名称</label>
                    <div class="input-group">
                        <input class="form-control" type="text" onclick="selectBiObjectTree()" id="treeName" readonly th:value="${biObject.name}">
                        <span class="input-group-addon"><i class="fa fa-search"></i></span>
                    </div>
                </div>
                <div class="form-group form-field">
                    <label class="control-label is-required" for="biObjectName">构件名称</label>
                    <input class="form-control" id="biObjectName" type="text"
                           th:if="${#strings.isEmpty(disease.biObjectName)}"
                           name="biObjectName" th:value="*{biObjectName}" required/>
                    <input class="form-control" id="biObjectName" type="text"
                           th:if="${!#strings.isEmpty(disease.biObjectName)}"
                           name="biObjectName" th:value="*{biObjectName}" readonly required/>
                </div>
                <div class="form-group form-field">
                    <label for="componentCode">构件编码</label>
                    <input name="component.code" class="form-control" id="componentCode" type="text"
                           th:field="*{component.code}" placeholder="请输入构件编码"/>
                </div>
                <div class="form-group form-field">
                    <label class="control-label is-required" for="diseaseGroupName">病害分组</label>
                    <select class="form-control select2" name="diseaseGroupName" id="diseaseGroupName" required>
                        <option value="">请选择病害分组</option>
                    </select>
                </div>
                <div class="form-group form-field">
                    <label class="control-label is-required" for="diseaseTypeId">病害类型</label>
                    <div class="paired-controls">
                        <select class="form-control select2" name="diseaseTypeId" id="diseaseTypeId" required th:field="*{diseaseTypeId}">
                            <option value="">请选择病害类型</option>
                        </select>
                        <input type="text" class="form-control" id="customDiseaseType" name="type" th:field="*{type}"
                               placeholder="请输入自定义病害类型" style="display: none"/>
                    </div>
                </div>
                <div class="form-group form-field">
                    <label for="position">病害位置</label>
                    <div class="paired-controls">
                        <select class="form-control select2" name="position" id="position" required>
                            <option value="">请选择病害位置</option>
                        </select>
                        <input type="text" class="form-control" id="customPosition" name="customPosition"
                               th:value="${customPosition}" placeholder="请输入自定义病害位置" style="display: none"/>
                    </div>
                </div>
                <div class="form-group form-field">
                    <label for="positionNumber">位置序号</label>
                    <input class="form-control" type="text" name="positionNumber" th:field="*{positionNumber}"
                           id="positionNumber" placeholder="例如：第 1 号"/>
                </div>
            </div>
        </section>

        <section class="edit-section" aria-labelledby="quantitativeTitle">
            <h4 class="form-header h4 section-heading" id="quantitativeTitle">病害定量数据</h4>
            <div class="quantity-grid" id="quantityFields"
                 th:style="${specialQuantitativeLayout} ? 'display: none;' : null">
                <div class="form-group form-field">
                    <label class="control-label is-required" for="quantityInput">缺损数量</label>
                    <input name="quantity" id="quantityInput" class="form-control" type="number" min="1" step="1"
                           required th:field="*{quantity}" oninput="validateQuantity(this)" onblur="formatQuantity(this)">
                    <div id="quantityError" class="invalid-feedback" style="display: none; color: #d9534f;"></div>
                </div>
                <div class="form-group form-field">
                    <label class="control-label is-required" for="units">单位</label>
                    <select name="units" id="units" class="form-control" th:field="*{units}">
                        <option value="条">条</option>
                        <option value="处">处</option>
                        <option value="个">个</option>
                    </select>
                </div>
            </div>
            <div id="diseaseDetails">
                <!-- 病害详情数据填写区域 -->
            </div>
        </section>

        <section class="edit-section" aria-labelledby="qualitativeTitle">
            <h4 class="form-header h4 section-heading" id="qualitativeTitle">病害定性数据</h4>
            <div class="form-grid">
                <div class="form-group form-field">
                    <label class="control-label is-required" for="developmentTrend">发展趋势</label>
                    <select class="form-control no-select2" name="developmentTrend" id="developmentTrend" required th:field="*{developmentTrend}">
                        <option value="新增">新增</option>
                        <option value="稳定">稳定</option>
                        <option value="发展">发展</option>
                        <option value="已维修">已维修</option>
                        <option value="部分维修">部分维修</option>
                        <option value="未找到">未找到</option>
                    </select>
                </div>
                <div class="form-group form-field">
                    <label class="control-label is-required" for="nature">病害性质</label>
                    <select class="form-control no-select2" name="nature" id="nature" required th:field="*{nature}">
                        <option value="非结构病害">非结构病害</option>
                        <option value="结构病害">结构病害</option>
                    </select>
                </div>
                <div class="form-group form-field">
                    <label class="control-label is-required" for="maxScale">最大标度</label>
                    <input name="maxScale" class="form-control" type="text" id="maxScale"
                           th:field="*{diseaseType.maxScale}" readonly/>
                </div>
                <div class="form-group form-field" th:if="${biObject.name != '其他'}">
                    <label class="control-label is-required">评定标度</label>
                    <div class="btn-group option-group" id="levelGroup" data-toggle="buttons">
                        <!-- 选项将通过JavaScript动态生成 -->
                    </div>
                </div>
                <div class="form-group form-field">
                    <label class="control-label is-required">参与评定</label>
                    <div class="btn-group option-group" data-toggle="buttons">
                        <label class="btn btn-default" th:classappend="${disease.participateAssess == '1'} ? 'active'">
                            <input type="radio" name="participateAssess" value="1" required
                                   th:checked="${disease.participateAssess == '1'}"/>是
                        </label>
                        <label class="btn btn-default" th:classappend="${disease.participateAssess == '0'} ? 'active'">
                            <input type="radio" name="participateAssess" value="0" required
                                   th:checked="${disease.participateAssess == '0'}"/>否
                        </label>
                    </div>
                </div>
                <div class="form-group form-field">
                    <label class="control-label is-required" for="imgNoExp">图片编号</label>
                    <input name="imgNoExp" class="form-control" type="text" id="imgNoExp"
                           placeholder="编号之间以“、”分隔" th:field="*{imgNoExp}" readonly/>
                </div>
                <input name="deductPoints" type="hidden" id="deductPoints" th:field="*{deductPoints}"/>
                <div class="form-group form-field field-full">
                    <label class="control-label is-required" for="description">病害描述</label>
                    <textarea name="description" id="description" required placeholder="请输入病害描述" maxlength="500"
                              class="form-control" rows="4" th:field="*{description}"></textarea>
                    <div class="textarea-actions">
                        <button type="button" class="btn btn-info edit-command" id="btnGenerateDescNew" onclick="generateAndFillDescriptionNew()">
                            <i class="fa fa-cogs"></i>生成病害描述
                        </button>
                    </div>
                </div>
            </div>
        </section>

        <section class="edit-section" aria-labelledby="otherInfoTitle">
            <h4 class="form-header h4 section-heading" id="otherInfoTitle">其它信息</h4>
            <div class="form-grid">
                <div class="form-group form-field field-full">
                    <label for="causeAnalysisBox">病害成因</label>
                    <div class="cause-layout">
                        <textarea id="causeAnalysisBox" name="cause" class="form-control" rows="5"></textarea>
                        <button type="button" class="btn btn-info edit-command" id="refreshCauseBtn">
                            <i class="fa fa-magic"></i>成因分析
                        </button>
                    </div>
                </div>
                <div class="form-group form-field field-full">
                    <label for="remark">备注</label>
                    <textarea id="remark" name="remark" maxlength="500" class="form-control" rows="3" th:field="*{remark}"></textarea>
                </div>
                <div class="form-group form-field field-full">
                    <label>附件</label>
                    <input type="file" name="attachmentFiles" id="diseaseFiles" multiple accept="*/*" style="display: none"/>
                    <div class="upload-toolbar">
                        <button type="button" class="btn btn-primary edit-command" onclick="$('#diseaseFiles').click()">
                            <i class="fa fa-upload"></i>选择文件
                        </button>
                    </div>
                    <div id="filePreview">
                        <!-- 这里是文件预览区域，会显示已上传的文件和新上传的文件 -->
                    </div>
                </div>
            </div>
        </section>

        <div class="form-actions">
            <button type="button" class="btn btn-primary edit-command" onclick="submitHandler()">
                <i class="fa fa-check"></i>保存
            </button>
            <button type="button" class="btn btn-danger edit-command" onclick="closeItem()">
                <i class="fa fa-reply-all"></i>关闭
            </button>
        </div>
    </form>
</div>
<th:block th:include="include :: footer"/>
<th:block th:include="include :: select2-js"/>
<!-- bootstrap-select -->
<script th:src="@{/ajax/libs/bootstrap-select/bootstrap-select.min.js?v=1.13.18}"></script>
<!--<script th:src="@{/js/marked.min.js}"></script>-->
<script th:inline="javascript">
    var prefix = ctx + "biz/disease"
    var disease = [[${disease}]];
    var biObject = [[${biObject}]];
    var customPosition = [[${customPosition}]];
    var diseaseTypes;
    var positionObjects;
    var specialQuantitativeLayout = [[${specialQuantitativeLayout}]];
    var defaultCrackTypes = ["纵向", "横向", "竖向", "斜向", "L型", "U型", "网状"];

    function isCustomDiseaseType(diseaseType) {
        return diseaseType && String(diseaseType.name || '').trim().indexOf('其他') === 0;
    }

    // 全局变量，存储所有图片的url、文件名和当前索引
    var previewImageList = [];
    var previewImageIndex = 0;

    $(function () {

        // 初始化select2，排除带有no-select2类的元素
        $('select.select2').select2({
            placeholder: "请选择",
            allowClear: true
        });


        // 确保发展趋势和病害性质下拉框正确初始化，不需要销毁select2实例
        // 因为我们已经在HTML中添加了no-select2类来排除它们

        // 重新绑定值，确保选项显示正确
        if (disease && disease.developmentTrend) {
            $("#developmentTrend").val(disease.developmentTrend);
        } else {
            $("#developmentTrend").val("稳定"); // 设置默认值
        }

        if (disease && disease.nature) {

    function selectBiObjectTree() {

        var ancestors = biObject.ancestors;
        var rootObjectId = "";

    // 加载病害类型
    function loadDiseaseTypes() {
        $.ajax({
            url: ctx + "biz/diseaseType/selectList",
            type: "POST",
            data: {
                biObjectId: biObject.id
            },
            success: function (result) {
                diseaseTypes = result;

                // 提取所有唯一的groupName
                var groupNames = [];
                $.each(result, function (i, item) {
                    if (item.groupName && groupNames.indexOf(item.groupName) === -1) {
                        groupNames.push(item.groupName);
                    }
                });

                // 填充病害分组下拉框
                var groupOptions = '<option value="">请选择病害分组</option>';
                $.each(groupNames, function (i, groupName) {
                    groupOptions += '<option value="' + groupName + '">' + groupName + '</option>';
                });
                $("#diseaseGroupName").html(groupOptions);

                // 编辑模式时，如果有选中的病害类型，需要先选中对应的分组
                if (disease && disease.diseaseTypeId) {
                    var selectedDiseaseType = result.find(function (item) {
                        return item.id == disease.diseaseTypeId;
                    });
                    if (selectedDiseaseType && selectedDiseaseType.groupName) {
                        $("#diseaseGroupName").val(selectedDiseaseType.groupName).trigger('change');

                        // 延迟设置病害类型选择，确保分组选择事件已处理
                        setTimeout(function () {

                            // 在设置选中值后，根据已选病害类型初始化病害详情区域
                            var quantity = $("#quantityInput").val() || 1;
                            updateDiseaseDetails(quantity);
                        }, 100);
                    }
                } else {
                    // 如果没有选中病害类型，使用默认显示
                    updateDiseaseDetails($("#quantityInput").val() || 1);
                }
            }
        });
    }

                parentId: biObject.id
            },
            success: function (result) {

                $.each(result, function (i, item) {

                            positionFound = true;

    function parseSpecialReferenceLocation(value, refIndex) {
        var raw = String(value == null ? '' : value).trim();
        var parts = raw.split('_');
        var result = {location: '', startSequence: '', endSequence: ''};
        if (!raw) return result;

        // 两个参考面名称都取“_”分割后的第一段。
        result.location = parts[0] || '';
        result.startSequence = parts[1] || '';
        if (refIndex === 2) {
            result.endSequence = parts[2] || '';
        }
        result.startSequence = String(result.startSequence || '').trim();
        result.endSequence = String(result.endSequence || '').trim();
        result.location = String(result.location || '').trim();
        return result;
    }

    function getSavedReferenceLocationRaw(detailIndex, refIndex) {
        if (!disease || !Array.isArray(disease.diseaseDetails) || !disease.diseaseDetails.length) {
            return '';
        }
        var detail = disease.diseaseDetails[detailIndex] || disease.diseaseDetails[0];
        if (!detail) return '';
        var raw = detail['reference' + refIndex + 'Location'];
        return raw == null ? '' : String(raw).trim();
    }

    function parseCrackTypesFromRemark(remark) {
        var raw = String(remark == null ? '' : remark).trim();
        if (!raw) return [];

        if (raw.charAt(0) === '[') {
            try {
                var parsed = JSON.parse(raw);
                if (Array.isArray(parsed)) {
                    return parsed.map(function (item) {
                        return String(item == null ? '' : item).trim();
                    }).filter(Boolean);
                }
            } catch (e) {
                // 非 JSON 备注继续按常用分隔符解析。
            }
        }

        return raw.split(/[，,、；;|\r\n]+/).map(function (item) {
            return item.trim();
        }).filter(Boolean);
    }

    function uniqueValues(values) {
        return values.filter(function (value, index, array) {
            return value && array.indexOf(value) === index;
        });
    }

    function escapeOptionText(value) {
        return String(value)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
    }

    function getCrackTypeOptions(selectedDiseaseType) {
        if (!specialQuantitativeLayout || !selectedDiseaseType) {
            return defaultCrackTypes.slice();
        }

        var remarkOptions = parseCrackTypesFromRemark(selectedDiseaseType.remark);
        return uniqueValues(remarkOptions.length ? remarkOptions : defaultCrackTypes.slice());
    }

    function isOriginalDiseaseType(selectedDiseaseType) {
        return selectedDiseaseType && disease
                && String(selectedDiseaseType.id) === String(disease.diseaseTypeId);
    }

    function buildCrackTypeOptions(selectedDiseaseType) {
        var options = getCrackTypeOptions(selectedDiseaseType);
        var savedCrackType = String(disease && disease.crackType ? disease.crackType : '').trim();

        // 历史数据可能早于 remark 配置，保留其原值以确保编辑页可以正常回显。
        if (specialQuantitativeLayout && isOriginalDiseaseType(selectedDiseaseType)
                && savedCrackType && options.indexOf(savedCrackType) === -1) {
            options.push(savedCrackType);
        }

        return uniqueValues(options).map(function (option) {
            var escapedOption = escapeOptionText(option);
            return '<option value="' + escapedOption + '">' + escapedOption + '</option>';
        }).join('');
    }

    function initializeCrackType(selectedDiseaseType) {
        var initialValue = getInitialCrackType(selectedDiseaseType);
        var crackTypeSelect = $("#crackType");

        crackTypeSelect.val(initialValue);
        if (crackTypeSelect.val() === null && crackTypeSelect.find('option').length) {
            crackTypeSelect.prop('selectedIndex', 0);
        }
    }

    function getInitialCrackType(selectedDiseaseType) {
        var savedCrackType = isOriginalDiseaseType(selectedDiseaseType) && disease.crackType
                ? disease.crackType
                : '';
        var options = getCrackTypeOptions(selectedDiseaseType);
        return savedCrackType || options[0] || '';
    }

    function applyReferenceSelectValue(select, customInput, locationName) {
        if (!select || !select.length) return;

        var value = String(locationName || '').trim();
        var custom = customInput && customInput.length ? customInput : $();

        if (!value) {
            select.val('');
            custom.hide().val('').removeAttr('required');
            return;
        }

        if (select.find('option').filter(function () {
            return String($(this).val() || '').trim() === value;
        }).length > 0) {
            select.val(value);
            custom.hide().val('').removeAttr('required');
            return;
        }

        select.val('其他');
        custom.val(value).show().attr('required', 'required');
    }

    function populateSpecialReferenceValues(detailContainer, detail) {
        if (!specialQuantitativeLayout || !detail) return;

        [1, 2].forEach(function (refIndex) {
            var item = detailContainer.find('.special-reference-item[data-reference-index="' + refIndex + '"]');
            if (!item.length) return;

            var locationField = 'reference' + refIndex + 'Location';
            var offsetField = 'reference' + refIndex + 'LocationStart';
            var parsedLocation = parseSpecialReferenceLocation(detail[locationField], refIndex);
            var select = item.find('.special-reference-select');

            if (select.length) {
                select.attr('data-current-value', parsedLocation.location);
            } else {
                item.find('[name$=".' + locationField + '"]').val(parsedLocation.location);
            }

            item.find('.special-reference-sequence-start').val(parsedLocation.startSequence);
            item.find('.special-reference-sequence-end').val(parsedLocation.endSequence);

            var rawOffset = detail[offsetField];
            var numericOffset = rawOffset === null || rawOffset === undefined || rawOffset === ''
                    ? null
                    : Number(rawOffset);
            var direction = numericOffset !== null && numericOffset < 0 ? '负方向' : '正方向';
            item.find('.special-offset-value').val(numericOffset === null ? '' : Math.abs(numericOffset));
            item.find('.special-direction-value').val(direction);
            item.find('.special-direction-btn')
                    .removeClass('active')
                    .attr('aria-pressed', 'false')
                    .filter('[data-direction="' + direction + '"]')
                    .addClass('active')
                    .attr('aria-pressed', 'true');
        });
    }

                    <div class="special-reference-body">

                        <div class="special-select-stack">
                            ${isCustomPosition
                                ? `<input type="text" class="form-control" name="${selectName}" placeholder="请输入${specialLabelText}">`
                                : `<select class="form-control special-reference-select" name="${selectName}" id="${selectId}">
                                    <option value="">请选择</option>
                                   </select>`
                            }
                        </div>
                        <div class="special-inline-input">
                            <input class="form-control special-reference-sequence-start" type="text" placeholder="起始序号">
                        </div>
                        <div class="special-inline-input">
                            <input class="form-control special-reference-sequence-end" type="text" placeholder="终止序号">
                        </div>
                        <div class="btn-group option-group special-direction-group">
                            <button type="button" class="btn btn-default special-direction-btn active" data-direction="正方向" aria-pressed="true">正方向</button>
                            <button type="button" class="btn btn-default special-direction-btn" data-direction="负方向" aria-pressed="false">负方向</button>
                        </div>
                        <input type="hidden" class="special-direction-value" value="正方向">
                        <div class="special-offset-input">
                            <div class="input-group measurement-control">
                                <input name="${startName}" class="form-control special-offset-value" type="number" step="0.01" placeholder="偏移量">
                                <span class="input-group-addon">mm</span>
                            </div>
                        </div>
                    </div>
                </div>`;
    }

    $(document).on('click', '.special-direction-btn', function () {
        var $group = $(this).closest('.special-direction-group');
        $group.find('.special-direction-btn').removeClass('active').attr('aria-pressed', 'false');
        $(this).addClass('active').attr('aria-pressed', 'true');
        $group.siblings('.special-direction-value').val($(this).data('direction'));
    });

    $(document).on('change', '#crackType', function () {
        updateSpecialLengthFieldsForCrackType($(this).val());
    });

    function hasQuantitativeValue(value) {
        return value !== null && value !== undefined && String(value).trim() !== '';
    }

    function getSelectedDiseaseTypeName(selectedDiseaseType) {
        if (selectedDiseaseType && selectedDiseaseType.name) {
            return String(selectedDiseaseType.name).trim();
        }
        return extractSpecialDiseaseName($("#diseaseTypeId option:selected").text());
    }

    function isUMJ3BDiseaseType(selectedDiseaseType) {
        return normalizeSpecialDiseaseName(getSelectedDiseaseTypeName(selectedDiseaseType)).toUpperCase() === 'UMJ-3(B)';
    }

    function getSpecialLengthPartCount(detail, selectedDiseaseType, crackType) {
        if (!specialQuantitativeLayout) return 1;

        if (isUMJ3BDiseaseType(selectedDiseaseType)) {
            var normalizedCrackType = normalizeSpecialDiseaseName(crackType).toUpperCase();
            if (normalizedCrackType === 'U+UMJ+U') return 3;
            if (normalizedCrackType === 'UMJ+U') return 2;
        }

        if (!detail) return 1;
        if (hasQuantitativeValue(detail.length3)) return 3;
        if (hasQuantitativeValue(detail.length2)) return 2;
        return 1;
    }

    function buildSpecialLengthFieldHtml(field) {
        var inputs = [];
        for (var partIndex = 0; partIndex < field.partCount; partIndex++) {
            if (partIndex > 0) {
                inputs.push('<span class="compound-separator">+</span>');
            }
            inputs.push(
                    '<div class="measurement-control">'
                    + '<input name="' + field.names[partIndex] + '" class="form-control" type="number" step="0.01"'
                    + ' placeholder="L' + (partIndex + 1) + '" value="' + escapeOptionText(field.values[partIndex]) + '">'
                    + '</div>'
            );
        }

        return '<div class="detail-field special-length-field">'
                + '<label class="field-label">' + field.label + '</label>'
                + '<div class="compound-input special-length-input length-parts-' + field.partCount + '">'
                + inputs.join('')
                + '<span class="input-group-addon">mm</span>'
                + '</div>'
                + '</div>';
    }

    function updateSpecialLengthFieldsForCrackType(crackType) {
        var selectedDiseaseType = getSelectedDiseaseType();
        if (!specialQuantitativeLayout || !isUMJ3BDiseaseType(selectedDiseaseType)) return;

        var partCount = getSpecialLengthPartCount(null, selectedDiseaseType, crackType);
        $('.defect-card').each(function () {
            var detailCard = $(this);
            var currentField = detailCard.find('.special-length-field');
            if (!currentField.length) return;

            var detailIndex = Number(detailCard.attr('data-detail-index'));
            if (Number.isNaN(detailIndex)) detailIndex = 0;
            var values = [1, 2, 3].map(function (partNumber) {
                return currentField.find('[name="diseaseDetails[' + detailIndex + '].length' + partNumber + '"]').val() || '';
            });
            if (partCount < 3) values[2] = '';

            currentField.replaceWith(buildSpecialLengthFieldHtml({
                label: '长度',
                names: [
                    'diseaseDetails[' + detailIndex + '].length1',
                    'diseaseDetails[' + detailIndex + '].length2',
                    'diseaseDetails[' + detailIndex + '].length3'
                ],
                values: values,
                partCount: partCount
            }));
        });
    }

    function normalizeSpecialDiseaseName(diseaseName) {
        return String(diseaseName || '')
                .replace(/\s+/g, '')
                .replace(/（/g, '(')
                .replace(/）/g, ')');
    }

    function isFastenerCountGroup(groupName) {
        var normalizedName = normalizeSpecialDiseaseName(groupName);
        return normalizedName === '铆钉(螺栓)缺失' || normalizedName === '铆钉(螺栓)松动';
    }

    function getSelectedDiseaseType() {
        var selectedDiseaseTypeId = $("#diseaseTypeId").val();
        return selectedDiseaseTypeId && Array.isArray(diseaseTypes) ? diseaseTypes.find(function (item) {
            return item.id == selectedDiseaseTypeId;
        }) : null;
    }

    function getDiseaseGroupName(selectedDiseaseType) {
        if (selectedDiseaseType && selectedDiseaseType.groupName) {
            return String(selectedDiseaseType.groupName).trim();
        }
        return String($("#diseaseGroupName").val() || '').trim();
    }

    function isCurrentFastenerCountDisease() {
        return specialQuantitativeLayout && isFastenerCountGroup(getDiseaseGroupName(getSelectedDiseaseType()));
    }

    function updateSpecialQuantityMode(fastenerCountMode) {
        var quantityFields = $("#quantityFields");
        var quantityInput = $("#quantityInput");
        var unitsSelect = $("#units");
        var hideQuantityFields = specialQuantitativeLayout && !fastenerCountMode;

        quantityFields.toggle(!hideQuantityFields);
        quantityInput.prop('disabled', hideQuantityFields);
        unitsSelect.prop('disabled', hideQuantityFields);
        $('label[for="quantityInput"]').toggleClass('is-required', !specialQuantitativeLayout);
        $('label[for="units"]').toggleClass('is-required', !specialQuantitativeLayout);
        quantityInput.prop('required', !specialQuantitativeLayout);

        if (hideQuantityFields) {
            $("#quantityError").hide();
            return;
        }

        if (fastenerCountMode) {
            if (String(quantityInput.val()) === '0') {
                quantityInput.val('');
            }
            if (!unitsSelect.find('option[data-fastener-empty="true"]').length) {
                unitsSelect.prepend('<option value="" data-fastener-empty="true">请选择单位</option>');
            }
            if (!String(disease.units || '').trim()) {
                unitsSelect.val('');
            }
            $("#quantityError").hide();
        } else {
            unitsSelect.find('option[data-fastener-empty="true"]').remove();
            if (!unitsSelect.val()) {
                unitsSelect.prop('selectedIndex', 0);
            }
        }
    }

    function updateDiseaseDetails(quantity) {
        var detailsContainer = $("#diseaseDetails");
        detailsContainer.empty();
        var isCustomPosition = (biObject.name === "其他" || biObject.name === "其它");
        var enteredQuantity = parseInt(quantity) || 1;

        // 获取当前选中的病害类型
        var selectedDiseaseTypeId = $("#diseaseTypeId").val();
        var selectedDiseaseType = selectedDiseaseTypeId ? diseaseTypes.find(function (item) {
            return item.id == selectedDiseaseTypeId;
        }) : null;
        var fastenerCountMode = specialQuantitativeLayout
                && isFastenerCountGroup(getDiseaseGroupName(selectedDiseaseType));
        updateSpecialQuantityMode(fastenerCountMode);
        quantity = specialQuantitativeLayout ? 1 : enteredQuantity;

        // 获取threshold值，默认为10
        var threshold = (selectedDiseaseType && selectedDiseaseType.threshold) ? selectedDiseaseType.threshold : 10;

        // 解析selectColumn字段决定显示哪些病害详情字段
        var showCrackType = true; // 默认全部显示
        var showLength = true;
        var showCrackWidth = true;
        var showHeightDepth = true;
        var showArea = true;
        var showDeformation = true;
        var showAngle = true;
        var showPercentage = true;

        if (selectedDiseaseType && selectedDiseaseType.selectColumn !== undefined) {
            var selectColumn = parseInt(selectedDiseaseType.selectColumn || 0);
            // 根据二进制位判断是否显示对应字段
            showCrackType = (selectColumn & 1) === 1; // 裂缝特征 - 1
            showLength = (selectColumn & 2) === 2; // 长度 - 2
            showCrackWidth = (selectColumn & 4) === 4; // 缝宽 - 4
            showHeightDepth = (selectColumn & 8) === 8; // 高度/深度 - 8
            showArea = (selectColumn & 16) === 16; // 面积 - 16
            showDeformation = (selectColumn & 32) === 32; // 变形/位移 - 32
            showAngle = (selectColumn & 64) === 64; // 角度 - 64
            showPercentage = (selectColumn & 128) === 128; // 比例 - 128
        }
        if (fastenerCountMode) {
            showCrackType = false;
            showLength = false;
            showCrackWidth = false;
            showHeightDepth = false;
            showArea = false;
            showDeformation = false;
            showAngle = false;
            showPercentage = false;
        }

        // 获取diseaseDetails数据，但不在模板字符串中直接使用
        var diseaseDetails = disease.diseaseDetails || [];

        if (showCrackType) {
            var crackTypeHtml = `
                <div class="quantity-grid detail-toolbar">
                    <div class="form-group form-field">
                        <label for="crackType">裂缝特征</label>
                        <select class="form-control" name="crackType" id="crackType">
                            ${buildCrackTypeOptions(selectedDiseaseType)}
                        </select>
                    </div>
                </div>`;
            detailsContainer.append(crackTypeHtml);
        }

        if (specialQuantitativeLayout || quantity < threshold) {
            for (var i = 0; i < quantity; i++) {
                // 收集需要显示的字段
                var fieldsToShow = [];

                if (showLength) {
                    if (specialQuantitativeLayout) {
                        var lengthDetail = diseaseDetails[i] || {};
                        fieldsToShow.push({
                            type: "specialLength",
                            label: "长度",
                            names: [
                                `diseaseDetails[${i}].length1`,
                                `diseaseDetails[${i}].length2`,
                                `diseaseDetails[${i}].length3`
                            ],
                            values: [
                                lengthDetail.length1 || "",
                                lengthDetail.length2 || "",
                                lengthDetail.length3 || ""
                            ],
                            partCount: getSpecialLengthPartCount(
                                    lengthDetail,
                                    selectedDiseaseType,
                                    getInitialCrackType(selectedDiseaseType)
                            )
                        });
                    } else {
                        fieldsToShow.push({
                            label: "长度",
                            name: `diseaseDetails[${i}].length1`,
                            step: "0.01",
                            placeholder: "长度",
                            unit: "m",
                            value: diseaseDetails[i]?.length1 || ""
                        });
                    }
                }

                if (showHeightDepth) {
                    fieldsToShow.push({
                        label: "高度/深度",
                        name: `diseaseDetails[${i}].heightDepth`,
                        step: "0.01",
                        placeholder: "高度/深度",
                        unit: "m",
                        value: diseaseDetails[i]?.heightDepth || ""
                    });
                }

                if (showCrackWidth) {
                    fieldsToShow.push({
                        label: "缝宽",
                        name: `diseaseDetails[${i}].crackWidth`,
                        step: "0.0001",
                        placeholder: "缝宽",
                        unit: "mm",
                        value: diseaseDetails[i]?.crackWidth || ""
                    });
                }

                if (showArea) {
                    fieldsToShow.push({
                        type: "area",
                        label: "面积",
                        nameLength: `diseaseDetails[${i}].areaLength`,
                        nameWidth: `diseaseDetails[${i}].areaWidth`,
                        nameIdentifier: `diseaseDetails[${i}].areaIdentifier`,
                        valueLength: diseaseDetails[i]?.areaLength || "",
                        valueWidth: diseaseDetails[i]?.areaWidth || "",
                        valueIdentifier: diseaseDetails[i]?.areaIdentifier || "0"
                    });
                }

                if (showDeformation) {
                    fieldsToShow.push({
                        label: "变形/位移",
                        name: `diseaseDetails[${i}].deformation`,
                        step: "0.01",
                        placeholder: "变形/位移",
                        unit: specialQuantitativeLayout ? "mm" : "m",
                        value: diseaseDetails[i]?.deformation || ""
                    });
                }

                if (showAngle) {
                    fieldsToShow.push({
                        label: "角度",
                        name: `diseaseDetails[${i}].angle`,
                        step: "1",
                        placeholder: "角度",
                        unit: "°",
                        value: diseaseDetails[i]?.angle || ""
                    });
                }

                if (showPercentage) {
                    fieldsToShow.push({
                        type: "ratio",
                        label: "比例",
                        nameNumerator: `diseaseDetails[${i}].numeratorRatio`,
                        nameDenominator: `diseaseDetails[${i}].denominatorRatio`,
                        valueNumerator: diseaseDetails[i]?.numeratorRatio || "",
                        valueDenominator: diseaseDetails[i]?.denominatorRatio || ""
                    });
                }

                // 每条缺损使用独立容器，避免动态字段与其它缺损相互挤压。
                var detailDiv = $(`
                    <article class="defect-card well well-sm${specialQuantitativeLayout ? ' special-quantitative-card' : ''}" data-detail-index="${i}">
                        <h5 class="defect-card-title">缺损 ${i + 1}</h5>
                        <div class="reference-grid${specialQuantitativeLayout ? ' special-reference-grid' : ''}"></div>
                        <div class="detail-grid"></div>
                    </article>`);

                detailDiv.find('.reference-grid').append(buildReferenceRowHtml(i, 1, isCustomPosition, specialQuantitativeLayout, false) + buildReferenceRowHtml(i, 2, isCustomPosition, specialQuantitativeLayout, false));

                var detailGrid = detailDiv.find('.detail-grid');
                fieldsToShow.forEach(function (field) {

                    if (field.type === "specialLength") {
                        detailGrid.append(buildSpecialLengthFieldHtml(field));
                    } else if (field.type === "area") {
                        if (specialQuantitativeLayout) {
                            detailGrid.append(`
                                  <div class="detail-field">
                                      <label class="field-label">${field.label}</label>
                                      <div class="compound-input area-input special-area-input">
                                          <div class="measurement-control">
                                              <input name="${field.nameLength}" class="form-control" type="number" step="0.01" placeholder="长" value="${field.valueLength}">
                                          </div>
                                          <span class="compound-separator">×</span>
                                          <div class="measurement-control">
                                              <input name="${field.nameWidth}" class="form-control" type="number" step="0.01" placeholder="宽" value="${field.valueWidth}">
                                          </div>
                                          <span class="input-group-addon">cm²</span>
                                          <input type="hidden" name="${field.nameIdentifier}" value="${field.valueIdentifier || '0'}">
                                      </div>
                                  </div>`);
                        } else {
                            detailGrid.append(`
                                  <div class="detail-field">
                                      <label class="field-label">${field.label}</label>
                                      <div class="compound-input area-input">
                                          <select name="${field.nameIdentifier}" class="form-control">
                                              <option value="0">普通</option>
                                              <option value="1">平均</option>
                                              <option value="2">总计</option>
                                          </select>
                                          <div class="measurement-control">
                                              <input name="${field.nameLength}" class="form-control" type="number" step="0.01" placeholder="长" value="${field.valueLength}">
                                              <span class="input-group-addon">m</span>
                                          </div>
                                          <span class="compound-separator">×</span>
                                          <div class="measurement-control">
                                              <input name="${field.nameWidth}" class="form-control" type="number" step="0.01" placeholder="宽" value="${field.valueWidth}">
                                              <span class="input-group-addon">m</span>
                                          </div>
                                      </div>
                                  </div>`);
                        }
                    } else if (field.type === "ratio") {
                        detailGrid.append(`
                                  <div class="detail-field">
                                      <label class="field-label">${field.label}</label>
                                      <div class="compound-input ratio-input">
                                          <input name="${field.nameNumerator}" class="form-control" type="number" step="0.01" placeholder="分子" value="${field.valueNumerator}">
                                          <span class="compound-separator">/</span>
                                          <input name="${field.nameDenominator}" class="form-control" type="number" step="0.01" placeholder="分母" value="${field.valueDenominator}">
                                      </div>
                                  </div>`);
                    } else {
                        detailGrid.append(`
                              <div class="detail-field">
                                  <label class="field-label">${field.label}</label>
                                  <div class="measurement-control">
                                      <input name="${field.name}" class="form-control" type="number" step="${field.step}" placeholder="${field.placeholder}" value="${field.value}">
                                      <span class="input-group-addon">${field.unit}</span>
                                  </div>
                              </div>`);
                    }
                });

                // 如果有对应的diseaseDetails数据，设置表单值
                if (showCrackType) {
                    initializeCrackType(selectedDiseaseType);
                }

                if (diseaseDetails && diseaseDetails[i]) {
                    var detail = diseaseDetails[i];

                    if (specialQuantitativeLayout) {
                        populateSpecialReferenceValues(detailDiv, detail);
                    } else {
                        if (isCustomPosition) {
                            detailDiv.find(`input[name="diseaseDetails[${i}].reference1Location"]`).val(detail.reference1Location || "");
                            detailDiv.find(`input[name="diseaseDetails[${i}].reference2Location"]`).val(detail.reference2Location || "");
                        }
                        // 注意：参考面位置的设置将在fillReferenceDropdowns后进行
                        detailDiv.find(`input[name="diseaseDetails[${i}].reference1LocationStart"]`).val(detail.reference1LocationStart || "");
                        detailDiv.find(`input[name="diseaseDetails[${i}].reference1LocationEnd"]`).val(detail.reference1LocationEnd || "");
                        detailDiv.find(`input[name="diseaseDetails[${i}].reference2LocationStart"]`).val(detail.reference2LocationStart || "");
                        detailDiv.find(`input[name="diseaseDetails[${i}].reference2LocationEnd"]`).val(detail.reference2LocationEnd || "");
                    }
                    detailDiv.find(`select[name="diseaseDetails[${i}].developmentTrend"]`).val(detail.developmentTrend || "稳定");

                    // 设置其他字段值（长度、宽度等）
                    if (showLength) {
                        detailDiv.find(`input[name="diseaseDetails[${i}].length1"]`).val(detail.length1 || "");
                        if (specialQuantitativeLayout) {
                            detailDiv.find(`input[name="diseaseDetails[${i}].length2"]`).val(detail.length2 || "");
                            detailDiv.find(`input[name="diseaseDetails[${i}].length3"]`).val(detail.length3 || "");
                        }
                    }
                    detailDiv.find(`input[name="diseaseDetails[${i}].width"]`).val(detail.width || "");
                    if (showHeightDepth) {
                        detailDiv.find(`input[name="diseaseDetails[${i}].heightDepth"]`).val(detail.heightDepth || "");
                    }
                    if (showCrackWidth) {
                        detailDiv.find(`input[name="diseaseDetails[${i}].crackWidth"]`).val(detail.crackWidth || "");
                    }
                    if (showArea) {
                        detailDiv.find(`input[name="diseaseDetails[${i}].areaLength"]`).val(detail.areaLength || "");
                        detailDiv.find(`input[name="diseaseDetails[${i}].areaWidth"]`).val(detail.areaWidth || "");
                        detailDiv.find(`select[name="diseaseDetails[${i}].areaIdentifier"]`).val(detail.areaIdentifier || "0");
                    }
                    if (showDeformation) {
                        detailDiv.find(`input[name="diseaseDetails[${i}].deformation"]`).val(detail.deformation || "");
                    }
                    if (showAngle) {
                        detailDiv.find(`input[name="diseaseDetails[${i}].angle"]`).val(detail.angle || "");
                    }
                    if (showPercentage) {
                        detailDiv.find(`input[name="diseaseDetails[${i}].numeratorRatio"]`).val(detail.numeratorRatio || "");
                        detailDiv.find(`input[name="diseaseDetails[${i}].denominatorRatio"]`).val(detail.denominatorRatio || "");
                    }
                }

                detailsContainer.append(detailDiv);
            }

            // 在多病害详情DOM创建完成后，立即填充参考面下拉框选项
            var selectedPositionId = $("#position").val();
            if (selectedPositionId && positionObjects) {
                var selectedPosition = positionObjects.find(function (item) {
                    return item.id == selectedPositionId;
                });
                if (selectedPosition) {
                    fillReferenceDropdowns(parseProps(selectedPosition.props), quantity, threshold);
                }
            }

            // 现在重新设置所有病害详情的值，确保下拉框选项已经正确填充
            if (diseaseDetails) {
                for (var i = 0; i < quantity; i++) {
                    if (diseaseDetails[i]) {
                        var detail = diseaseDetails[i];
                        var detailDiv = detailsContainer.find('.defect-card[data-detail-index="' + i + '"]');

                        if (!isCustomPosition && !specialQuantitativeLayout) {
                            // 处理参考面1位置 - 重新设置值
                            var ref1Select = detailDiv.find(`select[name="diseaseDetails[${i}].reference1Location"]`);
                            var ref1Value = detail.reference1Location || "";
                            var ref1Options = ref1Select.find('option').map(function () {
                                return $(this).val();
                            }).get();

                            if (ref1Value && ref1Options.indexOf(ref1Value) === -1 && ref1Value !== "其他") {
                                // 值不在选项中，选择"其他"并显示自定义输入框
                                ref1Select.val("其他").trigger('change');
                                detailDiv.find(`input[name="diseaseDetails[${i}].reference1LocationCustom"]`).val(ref1Value).show();
                            } else if (ref1Value === "" || ref1Options.indexOf(ref1Value) !== -1) {
                                ref1Select.val(ref1Value);
                            }

                            // 处理参考面2位置 - 重新设置值
                            var ref2Select = detailDiv.find(`select[name="diseaseDetails[${i}].reference2Location"]`);
                            var ref2Value = detail.reference2Location || "";
                            var ref2Options = ref2Select.find('option').map(function () {
                                return $(this).val();
                            }).get();

                            if (ref2Value && ref2Options.indexOf(ref2Value) === -1 && ref2Value !== "其他") {
                                // 值不在选项中，选择"其他"并显示自定义输入框
                                ref2Select.val("其他").trigger('change');
                                detailDiv.find(`input[name="diseaseDetails[${i}].reference2LocationCustom"]`).val(ref2Value).show();
                            } else if (ref2Value === "" || ref2Options.indexOf(ref2Value) !== -1) {
                                ref2Select.val(ref2Value);
                            }
                        }
                    }
                }
            }
        } else if (quantity >= threshold) {
            // 收集需要显示的字段，只显示有范围的字段
            var fieldsToShow = [];

            if (showLength) {
                fieldsToShow.push({
                    label: "长度范围",
                    nameStart: "diseaseDetails[0].lengthRangeStart",
                    nameEnd: "diseaseDetails[0].lengthRangeEnd",
                    unit: specialQuantitativeLayout ? "mm" : "m",
                    valueStart: diseaseDetails[0]?.lengthRangeStart || "",
                    valueEnd: diseaseDetails[0]?.lengthRangeEnd || ""
                });
            }

            if (showCrackWidth) {
                fieldsToShow.push({
                    label: "缝宽范围",
                    nameStart: "diseaseDetails[0].crackWidthRangeStart",
                    nameEnd: "diseaseDetails[0].crackWidthRangeEnd",
                    step: "0.0001",
                    unit: "mm",
                    valueStart: diseaseDetails[0]?.crackWidthRangeStart || "",
                    valueEnd: diseaseDetails[0]?.crackWidthRangeEnd || ""
                });
            }

            if (showHeightDepth) {
                fieldsToShow.push({
                    label: "高度/深度范围",
                    nameStart: "diseaseDetails[0].heightDepthRangeStart",
                    nameEnd: "diseaseDetails[0].heightDepthRangeEnd",
                    unit: "m",
                    valueStart: diseaseDetails[0]?.heightDepthRangeStart || "",
                    valueEnd: diseaseDetails[0]?.heightDepthRangeEnd || ""
                });
            }

            if (showDeformation) {
                fieldsToShow.push({
                    label: "变形/位移范围",
                    nameStart: "diseaseDetails[0].deformationRangeStart",
                    nameEnd: "diseaseDetails[0].deformationRangeEnd",
                    unit: specialQuantitativeLayout ? "mm" : "m",
                    valueStart: diseaseDetails[0]?.deformationRangeStart || "",
                    valueEnd: diseaseDetails[0]?.deformationRangeEnd || ""
                });
            }

            if (showAngle) {
                fieldsToShow.push({
                    label: "角度范围",
                    nameStart: "diseaseDetails[0].angleRangeStart",

    // 计算构件扣分
    function computeDeductPoints(maxScale, scale) {
        switch (parseInt(maxScale)) {
            case 3:
                switch (parseInt(scale)) {
                    case 1:
                        return 0;
                    case 2:
                        return 20;
                    case 3:
                        return 35;
                    default:
                        throw new Error("当 max_scale 为 3 时，scale 只能为 1、2 或 3");
                }
            case 4:
                switch (parseInt(scale)) {
                    case 1:
                        return 0;
                    case 2:
                        return 25;
                    case 3:
                        return 40;
                    case 4:
                        return 50;
                    default:
                        throw new Error("当 max_scale 为 4 时，scale 只能为 1、2、3 或 4");
                }
            case 5:
                switch (parseInt(scale)) {
                    case 1:
                        return 0;
                    case 2:
                        return 35;
                    case 3:
                        return 45;
                    case 4:
                        return 60;
                    case 5:
                        return 100;
                    default:
                        throw new Error("当 max_scale 为 5 时，scale 只能为 1、2、3、4 或 5");
                }
            default:
                throw new Error("max_scale 只能为 3、4 或 5");
        }
    }

    // 数量输入验证
    function validateQuantity(input) {
        const value = input.value;
        const errorElement = document.getElementById('quantityError');

        if (input.disabled) {
            errorElement.style.display = 'none';
            return true;
        }

        // 验证非空
        if (!value) {
            if (isCurrentFastenerCountDisease()) {
                errorElement.style.display = 'none';
                return true;
            }
            errorElement.textContent = '数量不能为空';
            errorElement.style.display = 'block';
            return false;
        }

        // 验证是否为整数
        if (!/^\d+$/.test(value)) {
            errorElement.textContent = '请输入整数';
            errorElement.style.display = 'block';
            return false;
        }

        // 验证范围
        const num = parseInt(value);
        if (num < 1 || num > 9999) {
            errorElement.textContent = '请输入1-9999之间的数值';
            errorElement.style.display = 'block';
            return false;
        }

        errorElement.style.display = 'none';
        return true;
    }

    // 格式化数量（失去焦点时处理）
    function formatQuantity(input) {
        if (input.disabled) return;

        if (!input.value) {
            if (isCurrentFastenerCountDisease()) {
                document.getElementById('quantityError').style.display = 'none';
                return;
            }
            input.value = 1;
        } else {
            input.value = Math.max(1, Math.min(9999, parseInt(input.value) || 1));
        }
        validateQuantity(input);
    }

    // 表单提交时最终验证
    function validateForm() {
        return validateQuantity(document.getElementById('quantityInput'));
    }

    // 初始化等级选择按钮组
    function initLevelGroup(maxScale) {
        var levelGroup = $("#levelGroup");
        levelGroup.empty();

        for (var i = 1; i <= maxScale; i++) {
            var label = $('<label class="btn btn-default">' +
                '<input type="radio" required name="level" value="' + i + '"> ' + i + '</label>');
            levelGroup.append(label);
        }

        // 如果是编辑模式，设置选中值
        if (disease && disease.level) {
            levelGroup.find('input[value="' + disease.level + '"]').prop('checked', true)
                .closest('label').addClass('active');
        } else {
            // 默认选中第一个选项
            levelGroup.find('label:first').addClass('active')
                .find('input[type="radio"]').prop('checked', true);
        }

        // 监听评定标度选择变化，自动选择对应的描述
        levelGroup.find('input[type="radio"]').off('change').on('change', function () {
            var selectedScale = $(this).val();
            var $description = $("#description");
            var $option = $description.find('option[value="' + selectedScale + '"]');
            if ($option.length) {
                $description.val(selectedScale).trigger('change');
            }

            // 计算并显示构件扣分
            var maxScale = $("#maxScale").val();
            if (maxScale && selectedScale) {
                try {
                    var deductPoints = computeDeductPoints(maxScale, selectedScale);
                    $("#deductPoints").val(deductPoints);
                } catch (e) {
                    console.error(e);
                    $("#deductPoints").val('');
                }
            }
        });
    }
