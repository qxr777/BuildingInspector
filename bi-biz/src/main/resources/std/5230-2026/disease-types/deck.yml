        metricKey: count_ratio
        valueLower: 10
        valueUpper: 50
        unit: "%"
      - scale: 3
        quantitative: 渗漏范围大于50%
        metricKey: count_ratio
        valueLower: 50
        unit: "%"
  - code: EXP-R-03
    name: 锚固螺栓松动、脱落
    parts: [expansionJoint]
    minScale: 1
    maxScale: 3
    scales:
      - scale: 1
        quantitative: 数量小于10%
        metricKey: count_ratio
        valueUpper: 10
        unit: "%"
      - scale: 2
        quantitative: 数量介于10%~30%
        metricKey: count_ratio
        valueLower: 10
        valueUpper: 30
        unit: "%"
      - scale: 3
        quantitative: 数量大于30%
        metricKey: count_ratio
        valueLower: 30
        unit: "%"

  # ===== 表 5.3.2 模数式伸缩装置 =====
