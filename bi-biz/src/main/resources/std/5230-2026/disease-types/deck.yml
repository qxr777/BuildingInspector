# 第 5 章 桥面系构件结构性缺损评定（正式稿 JTG/T 5230—2026）
# 部件键：paving 桥面铺装 / expansionJoint 伸缩装置 / railing 护栏及人行道 / drainage 排水系统
diseaseTypes:

  # ===== 表 5.2.1 沥青混凝土桥面铺装 =====
  - code: PAV-A-01
    name: 车辙
    parts: [paving]
    minScale: 1
    maxScale: 3
    scales:
      - scale: 1
        quantitative: 深度小于10mm
        metricKey: depth
        valueUpper: 10
        unit: mm
      - scale: 2
        quantitative: 深度介于10~25mm
        metricKey: depth
        valueLower: 10
        valueUpper: 25
        unit: mm
      - scale: 3
        quantitative: 深度大于25mm
        metricKey: depth
        valueLower: 25
        unit: mm
  - code: PAV-A-02
    name: 波浪拥包
    parts: [paving]
    minScale: 1
    maxScale: 3
    scales:
      - scale: 1
        quantitative: 高度小于10mm
        metricKey: height
        valueUpper: 10
        unit: mm
      - scale: 2
        quantitative: 高度介于10~25mm
        metricKey: height
        valueLower: 10
        valueUpper: 25
        unit: mm
      - scale: 3
        quantitative: 高度大于25mm
        metricKey: height
        valueLower: 25
        unit: mm
  - code: PAV-A-03
    name: 坑槽
    parts: [paving]
    minScale: 1
    maxScale: 3
    scales:
      - scale: 1
        quantitative: 深度不大于25mm，单处面积不大于0.1m²
      - scale: 2
        quantitative: 深度不大于25mm，单处面积大于0.1m²
      - scale: 3
        quantitative: 深度大于25mm
        metricKey: depth
        valueLower: 25
        unit: mm
  - code: PAV-A-04
    name: 龟裂
    parts: [paving]
    minScale: 0
    maxScale: 3
    scales:
      - scale: 0
        quantitative: 面积不大于0.04m²
        metricKey: area
        valueUpper: 0.04
        unit: m²
      - scale: 1
        quantitative: 单处面积大于0.04m²；累计面积小于0.2m²
      - scale: 2
        quantitative: 累计面积介于0.2~1m²
        metricKey: area
        valueLower: 0.2
        valueUpper: 1
        unit: m²
      - scale: 3
        quantitative: 累计面积大于1m²
        metricKey: area
        valueLower: 1
        unit: m²
  - code: PAV-A-05
    name: 纵向裂缝长度
    parts: [paving]
    minScale: 1
    maxScale: 3
    scales:
      - scale: 1
        quantitative: 长度小于桥跨长度的20%
        metricKey: length_ratio
        valueUpper: 20
        unit: "%"
      - scale: 2
        quantitative: 长度介于桥跨长度的20%~60%
        metricKey: length_ratio
        valueLower: 20
        valueUpper: 60
        unit: "%"
      - scale: 3
        quantitative: 长度大于桥跨长度的60%
        metricKey: length_ratio
        valueLower: 60
        unit: "%"
  - code: PAV-A-06
    name: 横向裂缝
    parts: [paving]
    minScale: 1
    maxScale: 3
    scales:
      - scale: 1
        quantitative: 裂缝宽度小于2mm
        metricKey: crack_width
        valueUpper: 2
        unit: mm
      - scale: 2
        quantitative: 裂缝宽度介于2~5mm
        metricKey: crack_width
        valueLower: 2
        valueUpper: 5
        unit: mm
      - scale: 3
        quantitative: 裂缝宽度大于5mm
        metricKey: crack_width
        valueLower: 5
        unit: mm

  # ===== 表 5.2.2 水泥混凝土桥面铺装 =====
  - code: PAV-C-01
    name: 磨光或露骨
    parts: [paving]
    minScale: 1
    maxScale: 2
    scales:
      - scale: 1
        quantitative: 单处面积不大于1m²；累计面积不大于桥跨面积的10%
      - scale: 2
        quantitative: 单处面积大于1m²；累计面积大于桥跨面积的10%
  - code: PAV-C-02
    name: 坑洞、露筋
    parts: [paving]
    minScale: 1
    maxScale: 3
    scales:
      - scale: 1
        quantitative: 坑洞深度小于10mm
        metricKey: depth
        valueUpper: 10
        unit: mm
      - scale: 2
        quantitative: 坑洞深度介于10~30mm
        metricKey: depth
        valueLower: 10
        valueUpper: 30
        unit: mm
      - scale: 3
        quantitative: 坑洞深度大于30mm；有露筋
  - code: PAV-C-03
    name: 裂缝
    parts: [paving]
    minScale: 1
    maxScale: 3
    scales:
      - scale: 1
        quantitative: 裂缝宽度小于0.3mm；裂缝间距大于3m
      - scale: 2
        quantitative: 裂缝宽度介于0.3~0.5mm；裂缝间距小于1m
      - scale: 3
        quantitative: 裂缝宽度大于0.5mm；完全断裂
  - code: PAV-C-04
    name: 错台
    parts: [paving]
    minScale: 1
    maxScale: 3
    scales:
      - scale: 1
        quantitative: 高差小于5mm
        metricKey: height
        valueUpper: 5
        unit: mm
      - scale: 2
        quantitative: 高差介于5~10mm
        metricKey: height
        valueLower: 5
        valueUpper: 10
        unit: mm
      - scale: 3
        quantitative: 高差大于10mm
        metricKey: height
        valueLower: 10
        unit: mm

  # ===== 表 5.3.1 橡胶式伸缩装置 =====
