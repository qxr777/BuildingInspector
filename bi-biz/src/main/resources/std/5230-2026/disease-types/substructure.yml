# 第 11 章 下部结构构件结构性缺损评定（正式稿 JTG/T 5230—2026）
diseaseTypes:
  # ================================================================
  # 11.2 桥墩
  # ================================================================
  # 表 11.2.1 砖石砌体桥墩评定
  # 注：脱落长度大于0.2m时计为砌缝脱落。
  - code: SUB-PIER-01
    name: 砌缝脱落
    parts: [pierAbutment]
    minScale: 1
    maxScale: 3
    scales:
      - scale: 1
        quantitative: 深度小于10mm
        metricKey: depth
        valueUpper: 10
        unit: mm
      - scale: 2
        quantitative: 深度介于10~20mm，范围不大于30%
      - scale: 3
        quantitative: 深度介于10~20mm，范围大于30%；深度大于20mm
  - code: SUB-PIER-02
    name: 砌体开裂
    parts: [pierAbutment]
    minScale: 1
    maxScale: 3
    scales:
      - scale: 1
        quantitative: 宽度小于0.2mm
        metricKey: crack_width
        valueUpper: 0.2
        unit: mm
      - scale: 2
        quantitative: 宽度介于0.2~0.5mm
        metricKey: crack_width
        valueLower: 0.2
        valueUpper: 0.5
        unit: mm
      - scale: 3
        quantitative: 宽度大于0.5mm
        metricKey: crack_width
        valueLower: 0.5
        unit: mm
  - code: SUB-PIER-03
    name: 砌块脱落
    parts: [pierAbutment]
    minScale: 2
    maxScale: 3
    scales:
      - scale: 2
        qualitative: 个别砌块脱落
        quantitative: 个别砌块脱落
      - scale: 3
        qualitative: 多个砌块脱落
        quantitative: 多个砌块脱落
  - code: SUB-PIER-04
    name: 变形、倾斜
    parts: [pierAbutment]
    minScale: 3
    maxScale: 3
    scales:
      - scale: 3
        quantitative: 大于规范或设计值

  # 表 11.2.2 钢筋混凝土实体桥墩、薄壁桥墩和空心桥墩评定
