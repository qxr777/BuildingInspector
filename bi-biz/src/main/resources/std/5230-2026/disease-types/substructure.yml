        valueUpper: 10
        unit: '%'
      - scale: 2
        quantitative: 脱空范围介于10%~30%截面
        metricKey: area_ratio
        valueLower: 10
        valueUpper: 30
        unit: '%'
      - scale: 3
        quantitative: 脱空范围大于30%截面
        metricKey: area_ratio
        valueLower: 30
        unit: '%'
  - code: SUB-PIER-16
