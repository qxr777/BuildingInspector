    name: 变形、倾斜
    parts: [pierAbutment]
    minScale: 3
    maxScale: 3
    scales:
      - scale: 3
        quantitative: 大于规范或设计值

  # 表 11.2.4 钢-混凝土组合桥墩评定
  - code: SUB-PIER-12
    name: 锈蚀
    parts: [pierAbutment]
    minScale: 1
    maxScale: 3
    scales:
      - scale: 1
        quantitative: 发生锈蚀且氧化皮已开始剥落，面积不大于10%
      - scale: 2
        quantitative: 发生锈蚀且氧化皮已开始剥落，面积大于10%
      - scale: 3
        quantitative: 氧化皮因锈蚀而剥落，有轻微点蚀
  - code: SUB-PIER-13
    name: 裂纹
    parts: [pierAbutment]
    minScale: 3
    maxScale: 3
    scales:
      - scale: 3
        qualitative: 有裂纹
        quantitative: 有裂纹
  # 注：明显局部变形时需确认外力导致或结构受力导致，必要时专项检查确认，外力导致且不影响结构受力时不参与评定。
  - code: SUB-PIER-14
    name: 局部变形
    parts: [pierAbutment]
    minScale: 3
    maxScale: 3
    scales:
      - scale: 3
        qualitative: 明显局部变形
