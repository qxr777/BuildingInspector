diseaseTypes:

  # ===== 表 6.2.12 钢箱梁 =====
  - code: STL-BOX-01
    name: 锈蚀
    parts: [steelMainGirder]
    minScale: 1
    maxScale: 3
    scales:
      - scale: 1
        quantitative: 发生锈蚀且氧化皮已开始剥落，面积不大于10%
        metricKey: area_ratio
        valueUpper: 10
        unit: "%"
      - scale: 2
        quantitative: 发生锈蚀且氧化皮已开始剥落，面积大于10%
        metricKey: area_ratio
        valueLower: 10
        unit: "%"
      - scale: 3
        qualitative: 氧化皮因锈蚀而剥落，有轻微点蚀
        quantitative: 氧化皮因锈蚀而剥落，有轻微点蚀
  - code: STL-BOX-02
    name: 裂纹
    parts: [steelMainGirder]
    minScale: 3
    maxScale: 3
    scales:
      - scale: 3
        qualitative: 有裂纹
        quantitative: 有裂纹
  - code: STL-BOX-03
    name: 局部变形
    parts: [steelMainGirder]
    minScale: 3
    maxScale: 3
