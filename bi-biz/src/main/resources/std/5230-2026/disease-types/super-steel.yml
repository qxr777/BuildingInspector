        valueUpper: 5
        unit: "%"
      - scale: 3
        quantitative: 裂纹长度大于断面长度的5%
        metricKey: length_ratio
        valueLower: 5
        unit: "%"
  - code: STL-BOX-05
    name: 螺栓、铆钉缺损
