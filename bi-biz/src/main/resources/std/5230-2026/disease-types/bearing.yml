# 第 6.4 节 支座各形式（正式稿 JTG/T 5230—2026）
# 均绑定部件键 bearing（B01–B07 全部梁桥共用，形式覆盖）
diseaseTypes:

  # ===== 表 6.4.1 板式橡胶支座 =====
  - code: BRG-P-01
    name: 老化开裂（矩形）
    parts: [bearing]
    minScale: 0
    maxScale: 3
    scales:
      - scale: 0
        qualitative: 轻度老化，无裂纹
        quantitative: 轻度老化，无裂纹
      - scale: 1
        quantitative: 龟裂；裂缝宽度小于0.5mm
        metricKey: crack_width
        valueUpper: 0.5
        unit: mm
      - scale: 2
        quantitative: 裂缝宽度介于0.5~2mm
        metricKey: crack_width
        valueLower: 0.5
        valueUpper: 2
        unit: mm
      - scale: 3
        quantitative: 裂缝宽度大于2mm
        metricKey: crack_width
        valueLower: 2
        unit: mm
  - code: BRG-P-02
    name: 老化开裂（圆形）
    parts: [bearing]
    minScale: 0
    maxScale: 3
    scales:
      - scale: 0
        qualitative: 轻度老化，无裂纹
        quantitative: 轻度老化，无裂纹
      - scale: 1
        quantitative: 龟裂；裂缝宽度小于0.5mm；裂缝长度小于周长的20%
      - scale: 2
        quantitative: 裂缝宽度介于0.5~2mm；裂缝长度介于周长的20%~40%
      - scale: 3
        quantitative: 宽度大于2mm；裂缝长度大于周长的40%
  - code: BRG-P-03
    name: 不均匀外鼓
    parts: [bearing]
    minScale: 1
    maxScale: 3
    scales:
      - scale: 1
        quantitative: 外鼓范围小于表面积的20%
        metricKey: area_ratio
        valueUpper: 20
        unit: "%"
      - scale: 2
        quantitative: 外鼓范围介于表面积的20%~50%
        metricKey: area_ratio
        valueLower: 20
        valueUpper: 50
        unit: "%"
      - scale: 3
        quantitative: 外鼓范围大于表面积的50%
        metricKey: area_ratio
        valueLower: 50
        unit: "%"
  - code: BRG-P-04
    name: 剪切变形*
    parts: [bearing]
    minScale: 2
    maxScale: 3
    scales:
      - scale: 2
        quantitative: 剪切角介于27°~35°
        metricKey: shear_angle
        valueLower: 27
        valueUpper: 35
        unit: "°"
      - scale: 3
        quantitative: 剪切角大于35°
        metricKey: shear_angle
        valueLower: 35
        unit: "°"
  - code: BRG-P-05
    name: 剪切变形b
    parts: [bearing]
    minScale: 0
    maxScale: 3
    scales:
      - scale: 0
        qualitative: 无明显剪切变形
        quantitative: 无明显剪切变形
      - scale: 1
        quantitative: 有明显剪切变形，剪切角小于5°
        metricKey: shear_angle
        valueUpper: 5
        unit: "°"
      - scale: 2
        quantitative: 剪切角介于5°~15°
        metricKey: shear_angle
        valueLower: 5
        valueUpper: 15
        unit: "°"
      - scale: 3
        quantitative: 剪切角大于15°
        metricKey: shear_angle
        valueLower: 15
        unit: "°"
  - code: BRG-P-06
    name: 脱空
    parts: [bearing]
    minScale: 2
    maxScale: 3
    scales:
      - scale: 2
        quantitative: 面积不大于承压面积的30%
        metricKey: area_ratio
        valueUpper: 30
        unit: "%"
      - scale: 3
        quantitative: 面积大于承压面积的30%
        metricKey: area_ratio
        valueLower: 30
        unit: "%"
  - code: BRG-P-07
    name: 串动
    parts: [bearing]
    minScale: 1
    maxScale: 3
    scales:
      - scale: 1
        qualitative: 轻度偏移，无悬空
        quantitative: 轻度偏移，无悬空
      - scale: 2
        quantitative: 串动不大于相应边长的25%，无悬空
        metricKey: length_ratio
        valueUpper: 25
        unit: "%"
      - scale: 3
        quantitative: 串动大于相应边长的25%，或局部悬空
        metricKey: length_ratio
        valueLower: 25
        unit: "%"
  - code: BRG-P-08
    name: 滑动组件缺损
    parts: [bearing]
    minScale: 1
    maxScale: 3
    scales:
      - scale: 1
        qualitative: 轻度受限
        quantitative: 轻度受限
      - scale: 2
        qualitative: 明显受限但仍可滑动
        quantitative: 明显受限但仍可滑动
      - scale: 3
        qualitative: 达到位移极限或变形、断裂
        quantitative: 达到位移极限或变形、断裂
  - code: BRG-P-09
    name: 承压板锈蚀
    parts: [bearing]
    minScale: 1
    maxScale: 2
    scales:
      - scale: 1
        quantitative: 轻度锈蚀，面积不大于30%
        metricKey: area_ratio
        valueUpper: 30
        unit: "%"
      - scale: 2
        quantitative: 锈蚀面积大于30%，有蚀坑
        metricKey: area_ratio
        valueLower: 30
        unit: "%"
  - code: BRG-P-10
    name: 安装缺陷
    parts: [bearing]
    minScale: 2
    maxScale: 3
    scales:
      - scale: 2
        qualitative: 普通矩形支座纵横反置
        quantitative: 普通矩形支座纵横反置
      - scale: 3
        qualitative: 滑动支座倒置
        quantitative: 滑动支座倒置
  - code: BRG-P-11
    name: 垫石缺损
    parts: [bearing]
    minScale: 1
    maxScale: 3
    scales:
      - scale: 1
        qualitative: 未拆模；边角缺损；顶面高差不大于2mm
        quantitative: 未拆模；边角缺损；顶面高差不大于2mm
      - scale: 2
        quantitative: 开裂宽度不大于0.3mm；顶面高差大于2mm
      - scale: 3
        quantitative: 开裂宽度大于0.3mm；压溃
  - code: BRG-P-12
    name: 周围环境缺损
    parts: [bearing]
    minScale: 2
    maxScale: 3
    scales:
      - scale: 2
        qualitative: 有垃圾或积水
        quantitative: 有垃圾或积水
      - scale: 3
        qualitative: 垃圾影响支座运行或长期积水
        quantitative: 垃圾影响支座运行或长期积水

